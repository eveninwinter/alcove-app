name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, swiftui-native-chat]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 0924 晚她定的：字体不打包（包从 30MB 涨到 80MB，她的字体点了就下，一直能用），拉字体那步删了

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Inject location token
        env:
          ALCOVE_LOC_TOKEN: ${{ secrets.ALCOVE_LOC_TOKEN }}
        run: |
          plutil -replace AlcoveLocToken -string "${ALCOVE_LOC_TOKEN}" ios/App/App/Info.plist
          plutil -replace AlcoveLocToken -string "${ALCOVE_LOC_TOKEN}" ios/App/CapabilityExtensions/Broadcast/Info.plist

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Build unsigned .app
        working-directory: ios/App
        run: |
          set +e
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath output/Alcove.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee /tmp/alcove-xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^|[[:space:]])(error:|fatal error:)|\.swift:[0-9]+:[0-9]+: error:' /tmp/alcove-xcodebuild.log \
              | tail -30 \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      - name: Verify native mist splash on iPhone simulator
        # 0909：这道检查一度全红，当时判成「CI 没显卡、检查太较真」，加了
        # continue-on-error 放行 —— 判错了。真因是 file:// 页面不许读本地图片像素，
        # WebGL 和 2D 兜底两条渲染路径一起被掐断，真机上同样划不动。
        # 根因修掉后它连过两次，闸门收回来，别再让一个对的警报被静音。
        run: bash scripts/mist-splash-smoke/run.sh

      - name: Upload mist splash verification
        # 0909 她说的：每个包底下都挂一个八兆的截图包，碍眼。
        # 改成只在出事时才留证 —— 检查过了就不上传，下载页只剩 IPA 一个；
        # 哪天再红，截图和 result.json 照旧躺在那儿等人来看（今晚就是靠它定的位）。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Mist-splash-verification
          path: mist-smoke-results/
          if-no-files-found: ignore

      - name: Strip signatures from frameworks
        working-directory: ios/App
        run: |
          find output/Alcove.xcarchive/Products/Applications/App.app/Frameworks -name '*.framework' -exec sh -c 'codesign --remove-signature "$1/$(basename "$1" .framework)" 2>/dev/null || true' _ {} \;
          codesign --remove-signature output/Alcove.xcarchive/Products/Applications/App.app/App 2>/dev/null || true

      - name: Package unsigned IPA
        working-directory: ios/App
        run: |
          mkdir -p output/Payload
          cp -r output/Alcove.xcarchive/Products/Applications/App.app output/Payload/
          cd output
          zip -r Alcove-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alcove-unsigned-ipa
          path: ios/App/output/Alcove-unsigned.ipa
          retention-days: 30
