<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eeeeeb">
<title>梦境 · Dreams</title>
<style>
:root{
  --paper:#eeeeeb;
  --ink:#141416;
  --gray:#6c6c70;
  --faint:#9a9a9e;
  --blue:#1638ff;
  --pink:#ff2d78;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --serif:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);overflow:hidden;overscroll-behavior:none}
body{color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
canvas{position:absolute;left:0;top:0;display:block}
#bg{z-index:1}
#moon{z-index:2;opacity:0;transition:opacity 1.8s ease}
#moon.on{opacity:1}
#fg{z-index:3}
.grain{position:absolute;inset:-60%;z-index:6;pointer-events:none;opacity:.26;mix-blend-mode:multiply;
  background-size:160px 160px;animation:grain 1.6s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-6%,3%)}40%{transform:translate(4%,-5%)}
  60%{transform:translate(-3%,6%)}80%{transform:translate(5%,2%)}100%{transform:translate(0,0)}}

header{position:absolute;z-index:7;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 30px);padding:0 24px 0 70px;pointer-events:none}
.back,.menu{position:absolute;top:2px;width:34px;height:34px;display:grid;place-items:center;color:var(--ink);pointer-events:auto;background:none;border:0;cursor:pointer}
.back{left:20px}.menu{right:18px}
h1{font-family:var(--serif);font-weight:700;font-size:34px;letter-spacing:.32em;line-height:1}
.stats{margin-top:16px;font-size:9.5px;letter-spacing:.28em;color:var(--gray);white-space:nowrap}
.gl{text-shadow:2px 0 rgba(255,45,120,.8),-2px 0 rgba(22,56,255,.8)}

.events{position:absolute;z-index:7;right:22px;top:calc(env(safe-area-inset-top,0px) + 108px);width:min(50vw,200px);pointer-events:none}
.events:not(:empty){background:rgba(238,238,235,.86);box-shadow:0 0 16px 12px rgba(238,238,235,.86);border-radius:4px}
.ev{position:relative;padding-left:14px;margin-bottom:12px;transition:opacity .6s}
.ev::before{content:"";position:absolute;left:0;top:4px;width:6px;height:6px;border-radius:50%;background:currentColor}
.ev .t{font-size:8.5px;letter-spacing:.14em;line-height:1.3}
.ev .d{font-family:var(--serif);font-size:12px;color:var(--ink);margin-top:3px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.link{color:var(--blue)} .ev.lost{color:var(--pink)}
.ev:nth-child(2){opacity:.55}

.vert{position:absolute;z-index:7;left:24px;top:calc(env(safe-area-inset-top,0px) + 118px);writing-mode:vertical-rl;pointer-events:none;
  font-size:9px;letter-spacing:.42em;color:var(--gray);display:flex;gap:14px;align-items:center}
.vert b{font-weight:400;font-family:var(--serif);font-size:11px;letter-spacing:.42em;color:#4a4a4e}

.card{position:absolute;z-index:7;left:26px;right:110px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);max-width:340px;pointer-events:none}
.meta{font-size:10px;letter-spacing:.18em;color:var(--gray);display:flex;gap:10px;align-items:center;white-space:nowrap}
.meta .tag{color:var(--pink);font-size:9px;letter-spacing:.2em}
.meta .tag[hidden]{display:none}
.card h2{font-family:var(--serif);font-weight:700;font-size:25px;letter-spacing:.06em;line-height:1.3;margin:9px 0 8px;min-height:1.3em}
.ex{font-family:var(--serif);font-size:13.5px;line-height:1.75;color:#59595e;letter-spacing:.04em}
.ex:empty{display:none}
.dash{width:12px;height:1px;background:#59595e;margin:9px 0 9px}
.foot{font-family:var(--serif);font-size:13px;color:#59595e;letter-spacing:.06em;display:flex;gap:10px;align-items:center}
.foot a{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:1px;pointer-events:auto;cursor:pointer}
.hint{margin-top:14px;font-size:8.5px;letter-spacing:.2em;color:var(--faint)}

.write{position:absolute;z-index:7;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;flex-direction:column;align-items:center;gap:8px;
  background:none;border:0;color:var(--ink);cursor:pointer;font-family:var(--serif);font-size:12px;letter-spacing:.24em;padding-left:.24em}
.write i{width:58px;height:58px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center}
@media (min-width:760px){ .card{left:auto;right:150px;width:340px} }
/* ===== 1009 App 里用：宋体随包、去掉记梦、卡片里加「那一夜」统计 / 00–07 时间轴 / 夜里的留痕 ===== */
@font-face{font-family:"Noto Serif SC";src:url(serif-sc.woff2) format("woff2");font-weight:200 900}
.write{display:none!important}
@font-face{font-family:"Pinyon Script";src:url(pinyon.ttf)}
h1 .script{font-family:"Pinyon Script",cursive;font-weight:400;font-size:44px;letter-spacing:0;line-height:1}
h1 small{font-family:var(--serif);font-weight:400;font-size:11px;letter-spacing:.3em;color:#8a8a88;margin-left:9px;position:relative;top:-4px}
.events{display:none!important}
#tonight{position:absolute;z-index:7;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--ink);cursor:pointer;font-family:var(--serif);font-size:12px;letter-spacing:.24em;padding-left:.24em}
#tonight i{width:58px;height:58px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.card{right:26px}
.ex{display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:-2px;height:47px}
.card h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:1.3em}
.meta{height:15px}
.foot{height:20px}
.night{font-size:9px;letter-spacing:.22em;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:14px}
.axis{margin:6px 0 12px;height:26px;width:100%;max-width:300px}
.axis svg{display:block;width:100%;height:26px;overflow:visible}
.trc{margin-top:12px;font-size:9.5px;letter-spacing:.18em;color:var(--gray);pointer-events:auto;cursor:pointer;display:block;height:14px;white-space:nowrap}
.trl{display:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <canvas id="moon"></canvas>
  <canvas id="fg"></canvas>
  <div class="grain" id="grain"></div>

  <header id="hd">
    <button class="back" aria-label="返回"><svg width="16" height="22" viewBox="0 0 16 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 3 11l9 9"/></svg></button>
    <h1 id="ttl"><span class="script">Dreams</span><small>梦境</small></h1>
    <p class="stats" id="stats"></p>
    <button class="menu" aria-label="菜单"><svg width="26" height="16" viewBox="0 0 26 16" stroke="currentColor" stroke-width="1.4"><path d="M1 1h24M1 8h24M7 15h18"/></svg></button>
  </header>

  <div class="events" id="events"></div>
  <p class="vert"><span>DRIFT</span></p>

  <section class="card" id="card">
    <p class="night" id="cNight"></p>
    <div class="axis" id="cAxis"></div>
    <p class="meta"><span id="cDate"></span><span class="tag" id="cTag">● STARTLED</span></p>
    <h2 id="cTitle"></h2>
    <p class="ex" id="cEx"></p>
    <div class="dash"></div>
    <p class="foot"><span id="cSeg"></span><a id="cRead" href="#">READ ›</a></p>
    <p class="trc" id="cTr"></p>
    <div class="trl" id="cTrL"></div>
    <p class="hint">按住空白处拖动 · 把梦拢到一起</p>
  </section>
  <button id="tonight" aria-label="回到今夜的梦"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M13.5 4.5a8 8 0 1 0 6 12.9A6.6 6.6 0 0 1 13.5 4.5z"/><path d="M19 2.6v3.6M17.2 4.4h3.6" stroke="#1638ff" stroke-width="1.2" stroke-linecap="round"/></svg></i>今夜</button>
  <button class="write" id="write"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M15.5 3.5a8.5 8.5 0 1 0 5 13.6A7 7 0 0 1 15.5 3.5z"/></svg></i>记梦</button>
</div>

<script>
/* ===== 1009 App 桥：App 在文档开头塞 window.DREAMS（真梦），这里把选中 / 读全文 / 返回 / 菜单递给原生，
   原生拉回正文摘要和「几段记忆」再填回来。卡片里的那一夜统计、时间轴、留痕都从 DREAMS 每一条带的字段画 ===== */
(() => {
  const post = m => { try { window.webkit.messageHandlers.dreams.postMessage(m); } catch (e) {} };
  const q = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let cur = null;
  function axis(d) {
    const marks = d.marks || [];
    if (!marks.length) return '';
    let h = '<svg viewBox="0 0 300 26" preserveAspectRatio="none">';
    h += '<line x1="0" y1="10" x2="300" y2="10" stroke="rgba(20,20,22,.35)" stroke-width=".6"/>';
    for (let t = 0; t <= 7; t++) {
      const x = t / 7 * 300;
      h += `<line x1="${x}" y1="7.5" x2="${x}" y2="10" stroke="rgba(20,20,22,.4)" stroke-width=".6"/>`;
      h += `<text x="${x}" y="23" font-size="7.5" fill="#9a9a9e" text-anchor="${t === 0 ? 'start' : t === 7 ? 'end' : 'middle'}" font-family="ui-monospace,Menlo,monospace" letter-spacing="1">${String(t).padStart(2, '0')}</text>`;
    }
    for (const m of marks) {
      const x = Math.max(2, Math.min(298, m.h / 7 * 300));
      if (m.kind === 'dream' && m.self) h += `<circle cx="${x}" cy="10" r="3.4" fill="#1638ff"/>`;
      else if (m.kind === 'dream') h += `<rect x="${x - 2}" y="8" width="4" height="4" fill="#141416"/>`;
      if (m.kind === 'startle' || (m.kind === 'dream' && m.startle)) h += `<path d="M${x - 3.5} 3.5H${x + 3.5}M${x} 0.5V6.5" stroke="#ff2d78" stroke-width=".9"/>`;
      if (m.kind === 'miss') h += `<circle cx="${x}" cy="10" r="2.2" fill="#eeeeeb" stroke="#9a9a9e" stroke-width=".7"/>`;
      if (m.kind === 'stir') h += `<circle cx="${x}" cy="10" r="1.4" fill="#9a9a9e"/>`;
    }
    return h + '</svg>';
  }
  function fill(d) {
    cur = d;
    q('#cNight').textContent = d.night || '';
    q('#cAxis').innerHTML = axis(d);
    q('#cEx').textContent = d.excerpt || '';
    q('#cSeg').textContent = d.seg != null ? `${d.seg} 段记忆` : '';
    const tr = d.traces || [];
    q('#cTr').textContent = tr.length ? `夜里还有 ${tr.length} 次留痕 ›` : '';
  }
  addEventListener('DOMContentLoaded', () => {
    q('#cTr').addEventListener('click', () => { if (cur && (cur.traces || []).length) post({ type: 'traces', id: String(cur.id) }); });
  });
  addEventListener('dream:select', e => { const d = e.detail; fill(d); post({ type: 'select', id: String(d.id) }); });
  addEventListener('dream:read', e => post({ type: 'read', id: String(e.detail.id) }));
  addEventListener('dream:back', () => post({ type: 'back' }));
  addEventListener('dream:menu', () => post({ type: 'menu' }));
  window.__dreamFill = (id, excerpt, seg) => {
    const d = (window.DREAMS || []).find(x => String(x.id) === String(id));
    if (!d) return;
    d.excerpt = excerpt; d.seg = seg;
    if (cur === d) { q('#cEx').textContent = excerpt || ''; q('#cSeg').textContent = seg != null ? `${seg} 段记忆` : ''; }
  };
  // 1009 #3510「今夜」：今天做了梦就是今天最近那场，没做就是最近那一夜的——DREAMS 新的在前，第一条就是
  addEventListener('DOMContentLoaded', () => {
    q('#tonight').addEventListener('click', () => { if (window.__dream && (window.DREAMS || []).length) window.__dream.select(0); });
  });
  window.__dreamSelect = id => {
    const i = (window.DREAMS || []).findIndex(x => String(x.id) === String(id));
    if (i >= 0 && window.__dream) window.__dream.select(i);
  };
})();
</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const app = $('#app'), bgC = $('#bg'), moonC = $('#moon'), fgC = $('#fg');
const bx = bgC.getContext('2d'), fx = fgC.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DREAMS = (Array.isArray(window.DREAMS) && window.DREAMS.length) ? window.DREAMS : SAMPLE_DREAMS;
const CSSV = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MONO = CSSV('--mono'), SERIF = CSSV('--serif');
const BLUE = '22,56,255', PINK = '255,45,120', INK = '20,20,22', PAPER = '#eeeeeb';
const GLYPHS = '01{}[]<>/\\|=+*#%&$@:;~^アイウカキサシ梦醒眠夜月░▒';
const SCR = '▖▘▝▗▚▞01#%&<>/\\{}アイ梦醒░';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hh = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ink = a => `rgba(${INK},${clamp(a, 0, 1).toFixed(3)})`;
const blue = a => `rgba(${BLUE},${clamp(a, 0, 1).toFixed(3)})`;
const pink = a => `rgba(${PINK},${clamp(a, 0, 1).toFixed(3)})`;

function scramble(el, text, dur = 560) {
  const id = (el._sid = (el._sid || 0) + 1);
  const t0 = performance.now(), chars = [...text], th = chars.map((_, i) => i / chars.length * .7 + Math.random() * .3);
  (function step(now) {
    if (el._sid !== id) return;
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = chars.map((c, i) => (p >= th[i] || c === ' ') ? c : SCR[(Math.random() * SCR.length) | 0]).join('');
    if (p < 1) requestAnimationFrame(step); else el.textContent = text;
  })(t0);
}

/* 纸面颗粒 */
(() => {
  const c = document.createElement('canvas'); c.width = c.height = 160;
  const x = c.getContext('2d'), d = x.createImageData(160, 160);
  for (let i = 0; i < d.data.length; i += 4) { const v = 255 - Math.pow(Math.random(), 4) * 60 | 0; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); $('#grain').style.backgroundImage = `url(${c.toDataURL()})`;
  if (RM) $('#grain').style.animation = 'none';
})();

/* =====================================================================
   月球：粒子点描（stipple）。每个点钉在球面上，暗处点密、亮处点稀，
   贴图只用来决定“哪里暗”，所以看起来像铅笔点画而不是照片。
   ===================================================================== */
const MOON_SCALE = 1.6;   // 画布半径 / 月球半径（给边缘飘散的尘留空间）
const Moon = (() => {
  const gl = moonC.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false }) ||
             moonC.getContext('experimental-webgl');
  if (!gl) return null;
  const VS = `
attribute vec3 aP; attribute vec3 aN; attribute vec2 aA;
uniform float uYaw,uTilt,uT,uG,uPt;
uniform vec3 uL;
varying vec4 vC;
float hs(float n){return fract(sin(n*12.9898)*43758.5453);}
vec3 rx(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x,c*p.y-s*p.z,s*p.y+c*p.z);}
vec3 ry(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);}
void main(){
  float rnd=aA.y;
  if(aA.x<0.){
    /* 从暗面边缘飘出去的尘 */

let W, H, DPR, S, R, CX, CY, FW, fieldTop, fieldBot, LINK, ZR, GR, cardR, evR, MS;
let staticC, specks = [], tags = [], hud = [], nodes = [];
const RINGS = [1.3, 1.37, 1.45, 1.53, 1.62, 1.74, 1.9];
const RING_TILT = .27, RING_ROT = -.1;

function layout() {
  W = app.clientWidth; H = app.clientHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  S = clamp(Math.min(W / 390, H / 780), .82, 1.5);
  const hb = $('#hd').getBoundingClientRect();
  cardR = $('#card').getBoundingClientRect(); evR = $('#events').getBoundingClientRect();
  fieldTop = hb.bottom + 14; fieldBot = cardR.top - 26;
  R = Math.round(clamp(Math.min(W * .275, (fieldBot - fieldTop) * .187), 66, 187));
  CX = W < 760 ? W / 2 : W * .45;
  CY = Math.round(lerp(fieldTop, fieldBot, .46));
  FW = Math.min(W / 2, Math.max(R * 3.0, 230 * S));
  const area = Math.max(1, 2 * FW * (fieldBot - fieldTop) - Math.PI * 2.05 * 1.25 * R * R);
  LINK = clamp(1.55 * Math.sqrt(area / Math.max(DREAMS.length, 8)), 62, 130);
  ZR = LINK * 1.5; GR = LINK * 1.85;

  MS = Math.ceil(2 * R * MOON_SCALE);
  Object.assign(moonC.style, { width: MS + 'px', height: MS + 'px', left: (CX - MS / 2) + 'px', top: (CY - MS / 2) + 'px' });
  if (Moon) Moon.resize(Math.round(MS * Math.min(devicePixelRatio || 1, 2)), R);
  buildStatic(); buildNodes();
}

function buildStatic() {

  const c = staticC.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);

  vg.addColorStop(0, 'rgba(255,255,255,.35)'); vg.addColorStop(1, 'rgba(120,120,125,.10)');

    const x = rnd() * W, y = fieldTop - 20 + rnd() * (fieldBot - fieldTop + 30);
    if (Math.hypot(x - CX, y - CY) < R * 1.05) continue;
    const a = Math.pow(rnd(), 2.4) * .55;
    if (rnd() < .12) specks.push({ x, y, a: a + .15, w: 1 + rnd() * 3, p: rnd() * 7 });

let T = 0, last = performance.now(), sel = 0, warm = true;
const links = new Map(), snaps = [], parts = [];

const evs = []; let evT = 0;

function event(type, a, b) {
  const now = performance.now(); if (now - evT < 900) return; evT = now;
  const mm = String(Math.floor(T / 60)).padStart(2, '0'), ss = String(Math.floor(T % 60)).padStart(2, '0');

}
function glitch(dur = .16) { if (RM) return; mv.gUntil = Math.max(mv.gUntil, T + dur); }

function select(i, quiet) {

  const date = [d.date, d.wd].filter(Boolean).join(' ') + (d.time ? ' · ' + d.time : '');
  if (quiet) { $('#cTitle').textContent = d.title; $('#cDate').textContent = date; }
  else { scramble($('#cTitle'), d.title, 620); scramble($('#cDate'), date, 420); glitch(.12); }
  $('#cEx').textContent = d.excerpt || '';
  $('#cSeg').textContent = `${d.seg ?? 1} 段记忆`;
  $('#cTag').hidden = !d.startle;

}
$('#cRead').addEventListener('click', e => { const d = DREAMS[sel]; window.dispatchEvent(new CustomEvent('dream:read', { detail: d })); if (!d.href || d.href === '#') e.preventDefault(); });
$('#write').addEventListener('click', () => window.dispatchEvent(new CustomEvent('dream:write')));

function update(dt) {

    if (Math.random() < .2) { const h = $('#ttl'); h.classList.add('gl'); setTimeout(() => h.classList.remove('gl'), 140); } }
  mv.glitch = T < mv.gUntil ? 1 : 0;
  if (ptr.mode !== 'moon') mv.dragTilt *= Math.exp(-dt * .6);
  const holdMoon = ptr.on && ptr.mode === 'moon';
  if (holdMoon) mv.dragYaw *= Math.exp(-dt * 8); else { mv.yaw += dt * (.055 + mv.dragYaw); mv.dragYaw *= Math.exp(-dt * 1.2); }

    const m = n.m;
    const bxp = n.ax + m.a1x * Math.sin(T * m.w1x + m.p1x) + m.a2x * Math.sin(T * m.w2x + m.p2x);
    const byp = n.ay + m.a1y * Math.sin(T * m.w1y + m.p1y) + m.a2y * Math.sin(T * m.w2y + m.p2y);
    const bzp = n.az + m.az * Math.sin(T * m.wz + m.pz);

    n.gw += ((w > .22 ? 1 : 0) - n.gw) * (1 - Math.exp(-dt * 7));
    const hv = (!ptr.on && ptr.hx >= 0 && Math.hypot(ptr.hx - n.x, ptr.hy - n.y) < 22 * S) ? 1 : 0;
    n.hov += (hv - n.hov) * (1 - Math.exp(-dt * 10));

          snaps.push({ i, j, t: T });
          for (let q = 0; q < 3 + (Math.random() * 4 | 0); q++) { const an = Math.random() * Math.PI * 2, sp = (12 + Math.random() * 30) * S;
            parts.push({ x: mx, y: my, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - 5 * S, t: T, life: .7 + Math.random() * .6, ch: GLYPHS[Math.random() * GLYPHS.length | 0], pk: Math.random() < .45 }); }

    }
  }
  warm = false;
  for (let k = snaps.length - 1; k >= 0; k--) if (T - snaps[k].t > .75) snaps.splice(k, 1);
  for (let k = parts.length - 1; k >= 0; k--) { const p = parts[k]; if (T - p.t > p.life) { parts.splice(k, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .97; p.vy *= .97; }
  for (const b of hud) if (T > b.next) { b.v = (Math.random() * 4).toFixed(5); b.next = T + 1.2 + Math.random() * 3.5; }
}

function moonState() {
  const tilt = .1 + .06 * Math.sin(T * .031) + mv.dragTilt;
  const L = [-.6, .42, .68], l = Math.hypot(...L);
  return { yaw: mv.yaw, tilt: clamp(tilt, -.5, .6), L: L.map(v => v / l), t: T, glitch: mv.glitch };
}
function project(latD, lonD, ms) {
  const la = latD * Math.PI / 180, lo = lonD * Math.PI / 180;
  let x = Math.cos(la) * Math.sin(lo), y = Math.sin(la), z = Math.cos(la) * Math.cos(lo);
  let c = Math.cos(-ms.yaw), s = Math.sin(-ms.yaw); [x, z] = [c * x + s * z, -s * x + c * z];
  c = Math.cos(-ms.tilt); s = Math.sin(-ms.tilt); [y, z] = [c * y - s * z, s * y + c * z];
  return { x: CX + x * R, y: CY - y * R, z };
}

/* =====================================================================
   绘制
   ===================================================================== */
function ringArc(c, k, a0, a1) { c.beginPath(); c.ellipse(CX, CY, R * k, R * k * RING_TILT, RING_ROT, a0, a1); c.stroke(); }
const DASHES = [[], [1, 2.5], [5, 2, 1, 2], [2, 3], [9, 2, 2, 2], [1, 5], [14, 3]];
function drawRings(c, back) {
  const a0 = back ? Math.PI : 0, a1 = back ? Math.PI * 2 : Math.PI;
  RINGS.forEach((k, i) => {
    c.setLineDash(DASHES[i].map(v => v * S)); c.lineDashOffset = T * (i % 2 ? 3 : -2) * S;
    c.strokeStyle = ink(i === 0 ? .7 : .28 + (i % 3) * .14); c.lineWidth = (i === 0 ? 1.1 : .7) * S;
    ringArc(c, k, a0, a1);
  });
  c.setLineDash([]);
  // 环上的两个标记：蓝=今夜、粉=惊醒
  for (const [k, sp, col, lab] of [[1.45, .22, BLUE, 'TONIGHT'], [1.74, -.15, PINK, '']]) {
    const t = ((T * sp) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    if ((t >= Math.PI) !== back) continue;
    const ex = Math.cos(t) * R * k, ey = Math.sin(t) * R * k * RING_TILT;
    const x = CX + ex * Math.cos(RING_ROT) - ey * Math.sin(RING_ROT), y = CY + ex * Math.sin(RING_ROT) + ey * Math.cos(RING_ROT);
    c.fillStyle = `rgb(${col})`; c.beginPath(); c.arc(x, y, (back ? 2.6 : 3.4) * S, 0, Math.PI * 2); c.fill();
    if (lab && !back) { c.font = `${7.5 * S}px ${MONO}`; c.fillStyle = `rgba(${col},.9)`; c.textAlign = 'left'; c.fillText(lab, x + 7 * S, y + 3 * S); }
  }
}

function drawBG(ms) {
  const c = bx; c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(staticC, 0, 0); c.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const s of specks) { const a = s.a * (.4 + .6 * Math.sin(T * s.w + s.p)); c.fillStyle = ink(a); c.fillRect(s.x, s.y, 1.2, 1.2); }
  c.font = `${7.5 * S}px ${MONO}`; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  for (const t of tags) { c.fillStyle = ink(.45); c.fillRect(t.x, t.y, 3, 3); c.fillText(t.t, t.x + 6 * S, t.y + 3); }
  c.font = `${8 * S}px ${MONO}`;
  for (const b of hud) { c.fillStyle = ink(.5); c.fillText(b.v, b.x, b.y - 5 * S); }
  // 月亮在纸上的影子（光从左上来）
  c.save(); c.translate(CX + R * .3, CY + R * 1.62); c.scale(1, .2);
  const sg = c.createRadialGradient(0, 0, 0, 0, 0, R * 1.25);
  sg.addColorStop(0, 'rgba(30,30,34,.26)'); sg.addColorStop(.5, 'rgba(30,30,34,.1)'); sg.addColorStop(1, 'rgba(30,30,34,0)');
  c.fillStyle = sg; c.beginPath(); c.arc(0, 0, R * 1.25, 0, Math.PI * 2); c.fill(); c.restore();
  drawRings(c, true);
  // 月球本体是一张“纸”，挡住后半圈的年轮
  c.fillStyle = PAPER; c.beginPath(); c.arc(CX, CY, R + .5, 0, Math.PI * 2); c.fill();
}

function seg(x0, y0, x1, y1) { fx.beginPath(); fx.moveTo(x0, y0); fx.lineTo(x1, y1); fx.stroke(); }

function thread(ax, ay, bx_, by, s, key, A, born) {
  const dx = bx_ - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
  const fray = 1 - sstep(.04, .3, s), solid = sstep(.28, .66, s), q = Math.floor(T * 14);
  if (solid > .02) { fx.strokeStyle = ink(.62 * solid * A); fx.lineWidth = .7 * S; seg(ax, ay, bx_, by); }
  const dashA = clamp(s * 2.4, 0, 1) * (1 - solid * .55) * (1 - fray * .85);
  if (dashA > .03) {
    fx.setLineDash([2.5 * S, 3 * S]); fx.lineDashOffset = -T * 20 * S * (key & 1 ? 1 : -1);
    fx.strokeStyle = ink(.55 * dashA * A); fx.lineWidth = .75 * S; seg(ax + nx * 1.6 * S, ay + ny * 1.6 * S, bx_ + nx * 1.6 * S, by + ny * 1.6 * S); fx.setLineDash([]);
  }
  if (fray > .03) {
    const n = Math.max(4, Math.round(len / (5 * S)));
    fx.beginPath();
    for (let i = 0; i < n; i++) {
      const u0 = i / n, u1 = (i + .62) / n, mid = 1 - Math.abs((u0 + u1) - 1);
      if (hh(key * 31.7 + i * 7.1 + q * .37) < fray * (.25 + .75 * mid)) continue;
      const j = (hh(key * 3.3 + i * 1.9 + q * 1.13) - .5) * 5.5 * S * fray * (.3 + mid);
      fx.moveTo(ax + dx * u0 + nx * j, ay + dy * u0 + ny * j); fx.lineTo(ax + dx * u1 + nx * j, ay + dy * u1 + ny * j);
    }
    const fa = .8 * fray * A * (.55 + .45 * hh(key + q));
    if (fray > .5) {
      fx.lineWidth = .7 * S;
      fx.save(); fx.translate(1.3 * S, 0); fx.strokeStyle = pink(.5 * fa); fx.stroke();
      fx.translate(-2.6 * S, 0); fx.strokeStyle = blue(.45 * fa); fx.stroke(); fx.restore();
    }
    fx.strokeStyle = ink(fa); fx.lineWidth = .75 * S; fx.stroke();
    fx.fillStyle = ink(.85 * fray * A);
    for (let i = 1; i < n; i += 3) if (hh(key * 5.1 + i * 3.7 + q * .71) < .3 * fray) {
      const u = i / n, j = (hh(key + i + q) - .5) * 7 * S * fray;
      fx.fillText(GLYPHS[(hh(key * 9 + i + q * 2.3) * GLYPHS.length) | 0], ax + dx * u + nx * j, ay + dy * u + ny * j);
    }
  }
  if (s > .45) { const p = (T * .5 + hh(key)) % 1; fx.fillStyle = ink(.9 * A * sstep(.45, .75, s)); fx.fillRect(ax + dx * p - S, ay + dy * p - S, 2 * S, 2 * S); }
  const age = T - born;
  if (age < .5) {
    const p = age / .5, g = Math.min(1, p * 2.4), cx = (ax + bx_) / 2, cy = (ay + by) / 2;
    fx.strokeStyle = blue(.95 * (1 - p)); fx.lineWidth = 1.4 * S; seg(cx - dx * .5 * g, cy - dy * .5 * g, cx + dx * .5 * g, cy + dy * .5 * g);
  }
}
function halo(c) { c.shadowColor = 'rgba(238,238,235,.95)'; c.shadowBlur = 6 * S; }

function drawFG(ms) {
  const c = fx; c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, W, H);
  drawRings(c, false);

  // 月面标注：Lacus Somniorum（梦湖）是月球上真实存在的地名
  const lp = project(38, 29, ms);
  if (lp.z > .1) {
    const a = sstep(.1, .45, lp.z), tx = Math.min(CX + R * 1.18, W - 96 * S), ty = CY - R * 1.08;
    c.strokeStyle = ink(.75 * a); c.lineWidth = .7; c.strokeRect(lp.x - 3, lp.y - 3, 6, 6);
    c.beginPath(); c.moveTo(lp.x + 3, lp.y - 3); c.lineTo(tx - 4, ty + 5); c.lineTo(tx + 74 * S, ty + 5); c.stroke();
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.font = `${7.5 * S}px ${MONO}`; c.fillStyle = ink(.75 * a); c.fillText('LACUS SOMNIORUM', tx, ty - 2);
    c.font = `${10 * S}px ${SERIF}`; c.fillStyle = ink(.9 * a); c.fillText('梦湖', tx, ty + 19 * S);
    c.font = `${7 * S}px ${MONO}`; c.fillStyle = ink(.5 * a); c.fillText('38°N 29°E', tx + 26 * S, ty + 19 * S);
  }

  c.font = `${7 * S}px ${MONO}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const strong = [];
  for (const L of links.values()) {
    const a = nodes[L.i], b = nodes[L.j], isSel = (L.i === sel || L.j === sel) ? 1.4 : 1;
    const A = (.32 + .68 * (a.dep + b.dep) / 2) * Math.min(a.vis, b.vis) * isSel;
    thread(a.x, a.y, b.x, b.y, L.s, L.k, Math.min(1, A), L.b);
    if (L.s > .5) strong.push(L);
  }
  strong.sort((p, q) => q.s - p.s);
  c.font = `${6.5 * S}px ${MONO}`;
  for (const L of strong.slice(0, 2)) { const a = nodes[L.i], b = nodes[L.j]; c.fillStyle = ink(.45); c.fillText((L.s * .618 + hh(L.k) * .2).toFixed(5), (a.x + b.x) / 2 + 9 * S, (a.y + b.y) / 2 - 7 * S); }

  for (const sn of snaps) {
    const p = (T - sn.t) / .75, a = nodes[sn.i], b = nodes[sn.j];
    for (const [o, sg] of [[a, 1], [b, -1]]) {
      const ex = (a.x + b.x) / 2 - o.x, ey = (a.y + b.y) / 2 - o.y, el = Math.hypot(ex, ey) || 1, nx = -ey / el, ny = ex / el, Lr = Math.pow(1 - p, 1.7);
      c.beginPath();
      for (let k = 0; k <= 8; k++) { const f = k / 8 * Lr, w = Math.sin(k * 1.9 + T * 38 * sg + sn.i) * 3 * S * (1 - p) * (k / 8); const px = o.x + ex * f + nx * w, py = o.y + ey * f + ny * w; k ? c.lineTo(px, py) : c.moveTo(px, py); }
      c.strokeStyle = pink(.75 * (1 - p) * (1 - p)); c.lineWidth = .8 * S; c.stroke();
    }
  }
  c.font = `${7 * S}px ${MONO}`;
  for (const p of parts) { const k = 1 - (T - p.t) / p.life; c.fillStyle = p.pk ? pink(.9 * k) : ink(.8 * k); c.fillText(p.ch, p.x, p.y); }

  if (ptr.on && ptr.mode === 'gather') {
    c.setLineDash([1.5, 4]); c.strokeStyle = ink(.35); c.lineWidth = .7; c.beginPath(); c.arc(ptr.x, ptr.y, GR * (.96 + .04 * Math.sin(T * 6)), 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
    for (const n of nodes) { const d = Math.hypot(n.x - ptr.x, n.y - ptr.y); if (d < LINK * 1.35 && n.vis > .3) thread(ptr.x, ptr.y, n.x, n.y, 1 - d / (LINK * 1.35), 9000 + n.i, .8, -9); }
    c.strokeStyle = blue(.9); c.lineWidth = 1; seg(ptr.x - 7, ptr.y, ptr.x + 7, ptr.y); seg(ptr.x, ptr.y - 7, ptr.x, ptr.y + 7);
  }

  const order = nodes.slice().sort((p, q) => p.dep - q.dep);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  for (const n of order) {
    if (n.vis < .03) continue;
    const a = (.3 + .7 * n.dep) * n.vis, x = n.x, y = n.y, sz = (1.6 + 1.6 * n.dep) * S;
    if (n.d.startle) { const fl = (3 + 5 * n.dep) * S; c.strokeStyle = ink(.45 * a); c.lineWidth = .6; seg(x - fl, y, x + fl, y); seg(x, y - fl * .75, x, y + fl * .75); }
    c.fillStyle = ink(a); c.fillRect(x - sz / 2, y - sz / 2, sz, sz);
    if (n.box) {
      const bw = n.box.w, bh = n.box.h, bxp = x - bw * n.box.fx, byp = y - bh * n.box.fy;
      corners(c, bxp, byp, bw, bh, 5 * S, ink(.35 * a));
      if (n.dep > .5) { c.font = `${6.5 * S}px ${MONO}`; c.fillStyle = ink(.42 * a); c.fillText(n.val, bxp, byp - 3 * S); }
    }
    if (n.dep > .72 || (n.deg > 0 && n.dep > .42)) { c.font = `${7.5 * S}px ${MONO}`; c.fillStyle = ink((.22 + .4 * n.dep) * a); c.fillText(n.d.date, x + 5 * S, y - 4 * S); }
    const rv = Math.max(n.gw, n.hov);
    if (rv > .03 && n.i !== sel) { c.font = `${10.5 * S}px ${SERIF}`; halo(c); c.fillStyle = ink(rv * Math.min(1, a + .3)); c.fillText(n.d.title, x + 6 * S, y + 12 * S); c.shadowBlur = 0; }
  }

  // 选中的梦：蓝点 + 细蓝线连到卡片（和日记里“9 —— 今天”的连接一样）
  const s = nodes[sel];
  if (s) {
    const x = s.x, y = s.y, pr = (8 + 1.5 * Math.sin(T * 3)) * S;
    c.strokeStyle = blue(.5); c.lineWidth = .8; c.beginPath(); c.arc(x, y, pr, 0, Math.PI * 2); c.stroke();
    c.fillStyle = `rgb(${BLUE})`; c.beginPath(); c.arc(x, y, 3.6 * S, 0, Math.PI * 2); c.fill();
    const right = x < W - 140 * S, tx = right ? x + 14 * S : x - 14 * S;
    c.textAlign = right ? 'left' : 'right'; halo(c);
    c.font = `600 ${12 * S}px ${SERIF}`; c.fillStyle = ink(.95); c.fillText(s.d.title, tx, y + 4.5 * S);
    c.font = `${7.5 * S}px ${MONO}`; c.fillStyle = blue(.95); c.fillText(`${s.d.date} · ${s.d.time || ''}`, tx, y - 9 * S);
    c.shadowBlur = 0; c.textAlign = 'left';
    const ax = cardR.left, ay = cardR.top - 14 * S, yy = Math.max(y + pr, ay);
    c.strokeStyle = blue(.75); c.lineWidth = .8; c.beginPath(); c.moveTo(x, y + pr); c.lineTo(x, yy); c.lineTo(ax, yy); c.stroke();
    c.fillStyle = `rgb(${BLUE})`; c.beginPath(); c.arc(ax, yy, 2.4 * S, 0, Math.PI * 2); c.fill();
  }

  if (mv.glitch && !RM) {
    c.setTransform(1, 0, 0, 1, 0, 0);
    for (let k = 0; k < 3; k++) {
      const hgt = Math.round((3 + Math.random() * 16) * S * DPR), yy = Math.round(Math.random() * (fgC.height - hgt)), dx = Math.round((Math.random() - .5) * 24 * S * DPR);
      c.drawImage(fgC, 0, yy, fgC.width, hgt, dx, yy, fgC.width, hgt);
    }
  }
}

/* =====================================================================
   交互
   ===================================================================== */
function nearest(x, y, r) { let bi = -1, bd = r; for (const n of nodes) { if (n.vis < .3) continue; const d = Math.hypot(n.x - x, n.y - y); if (d < bd) { bd = d; bi = n.i; } } return bi; }
app.addEventListener('pointerdown', e => {
  if (e.target.closest('button, a')) return;
  app.setPointerCapture?.(e.pointerId);
  const x = e.clientX, y = e.clientY;
  Object.assign(ptr, { on: true, x, y, sx: x, sy: y, t: performance.now(), moved: 0 });
  ptr.mode = Math.hypot(x - CX, y - CY) < R * 1.2 ? 'moon' : (nearest(x, y, 18 * S) >= 0 ? 'node' : 'gather');
});
app.addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY;
  if (!ptr.on) { ptr.hx = e.pointerType === 'mouse' ? x : -1; ptr.hy = y; return; }
  ptr.moved = Math.max(ptr.moved, Math.hypot(x - ptr.sx, y - ptr.sy));
  if (ptr.mode === 'moon') { const ddx = (x - ptr.x) / R, ddy = (y - ptr.y) / R; mv.yaw -= ddx; mv.dragYaw = clamp(-ddx * 30, -2.5, 2.5); mv.dragTilt = clamp(mv.dragTilt - ddy, -.6, .6); }
  if (ptr.mode === 'node' && ptr.moved > 10) ptr.mode = 'gather';
  ptr.x = x; ptr.y = y;
});
function end() {
  if (!ptr.on) return;
  if (performance.now() - ptr.t < 450 && ptr.moved < 9) {
    const i = nearest(ptr.sx, ptr.sy, 30 * S);
    if (i >= 0 && ptr.mode !== 'moon') select(i);
    else if (ptr.mode === 'moon') glitch(.22);
  }
  ptr.on = false; ptr.mode = '';
}
app.addEventListener('pointerup', end); app.addEventListener('pointercancel', end);
app.addEventListener('pointerleave', () => { ptr.hx = -1; });

/* =====================================================================
   启动
   ===================================================================== */
const startles = DREAMS.filter(d => d.startle).length, first = DREAMS[DREAMS.length - 1];
$('#stats').textContent = `${DREAMS.length} DREAMS · ${startles} STARTLES · SINCE ${first ? first.date : ''}`;
layout(); select(0, true);
if (Moon) Moon.ready.then(() => { layout(); moonC.classList.add('on'); }).catch(() => {});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });

function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 15) return;
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (document.hidden) return;
  T += dt * (RM ? .5 : 1);
  update(dt);
  const ms = moonState();
  drawBG(ms);
  if (Moon) Moon.draw(ms);
  drawFG(ms);
}
requestAnimationFrame(frame);
window.__dream = { get nodes() { return nodes; }, links, select, get T() { return T; } };
})();
</script>
</body>
</html>
