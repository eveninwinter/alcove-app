<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 1010 #3634：字体都随包，网上这份只给随包宋体缺的那十来个字兜底，不挡页面（media=print 先不算，到了再生效） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap" media="print" onload="this.media='all'">
<style>
  @font-face { font-family: 'Pinyon Script'; src: url(pinyon.ttf); }
  @font-face { font-family: 'IBM Plex Mono'; src: url(plex-mono-300.woff2) format('woff2'); font-weight: 300; }
  @font-face { font-family: 'Serif SC Local'; src: url(serif-sc.woff2) format('woff2'); font-weight: 200 900; }
  html, body { margin: 0; height: 100%; background: #F6F6F4; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  .frame { position: absolute; left: 50%; top: 50%; width: 390px; transform-origin: center center; background: #F6F6F4;
    opacity: 0; transition: opacity .35s ease; }
  .frame.ready { opacity: 1; }   /* 1010 #3634：算好、画好第一帧再淡入，不让没排版的字先闪一下 */
  canvas { position: absolute; left: 0; width: 390px; display: block; }
  #c { top: 0; touch-action: none; }
  #sea { pointer-events: none; }
  .ui { position: absolute; pointer-events: none; color: #141414; white-space: nowrap; }
  .icon { position: absolute; width: 36px; height: 36px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .title { left: 0; right: 0; top: 44px; text-align: center; font-family: 'Pinyon Script', cursive; font-size: 25px; line-height: 28px; }
  .date { left: 22px; top: 360px; font-family: 'Serif SC Local', 'Noto Serif SC', 'Noto Serif CJK SC', 'Songti SC', serif; font-weight: 300; font-size: 33px; line-height: 1; letter-spacing: -.01em; }
  .day { left: 24px; top: 407px; font-family: 'IBM Plex Mono', monospace; font-weight: 300; font-size: 7.5px; letter-spacing: .04em; color: #6E6E6E; }
  .page { left: 75px; top: 406px; font-family: 'Serif SC Local', 'Noto Serif SC', 'Noto Serif CJK SC', 'Songti SC', serif; font-weight: 300; font-size: 7px; color: #6E6E6E; }
  .count { left: 22px; bottom: 25px; font-family: 'Serif SC Local', 'Noto Serif SC', 'Noto Serif CJK SC', 'Songti SC', serif; font-weight: 300; font-size: 7px; line-height: 9px; color: #787878; }
  .fall { right: 22px; bottom: 21px; font-family: 'Pinyon Script', cursive; font-size: 13px; line-height: 16px; color: #787878;
    pointer-events: auto; cursor: pointer; padding: 8px; margin: -8px; }
  .date { pointer-events: auto; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; color: #141414; }
  .page b { font-weight: 400; }
  .page .dots { margin-left: 5px; letter-spacing: 2px; }

  /* 月历：从日期下面展开 */
  .cal { position: absolute; left: 22px; top: 424px; width: 244px; padding: 13px 12px 12px; background: #FBFBF9; border: .5px solid rgba(20,20,20,.12);
    font-family: 'Serif SC Local', 'Noto Serif SC', 'Noto Serif CJK SC', 'Songti SC', serif; color: #141414; transform-origin: top left;
    animation: calIn .22s ease both; z-index: 5; }
  .cal[hidden] { display: none; }
  @keyframes calIn { from { opacity: 0; transform: translateY(-4px); } }
  .cal-head { display: flex; align-items: center; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-weight: 300; font-size: 11px; letter-spacing: .14em; }
  .cal-nav { width: 34px; height: 28px; border: 0; background: none; padding: 0; cursor: pointer; font-size: 17px; color: #141414; }
  .cal-nav:disabled { opacity: .2; cursor: default; }
  .cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
  .cal-week { margin: 9px 0 3px; font-family: 'IBM Plex Mono', monospace; font-weight: 300; font-size: 8.5px; color: #9A9A9A; }
  .cal-day { position: relative; height: 31px; border: 0; background: none; padding: 0; cursor: pointer; font-family: inherit; font-size: 11.5px; color: #141414; }
  .cal-day span { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 50%; }
  .cal-day.empty { color: #A8A8A8; }
  .cal-day:disabled { color: #D6D6D6; cursor: default; }
  .cal-day.sel span { background: #141414; color: #F6F6F4; }
  .cal-day.today span { box-shadow: inset 0 0 0 .5px #141414; }
  .cal-day i { position: absolute; left: 50%; bottom: 1.5px; transform: translateX(-50%); display: flex; gap: 2px; }
  .cal-day i b { width: 3px; height: 3px; border-radius: 50%; background: #141414; }

  /* 便签：长按泪弹出 */
  .note { position: absolute; left: 116px; top: 343px; width: 258px; height: 400px; background: #FCFCFA; border: .5px solid rgba(20,20,20,.1);
    z-index: 6; display: flex; flex-direction: column; color: #1A1A1A; font-family: 'Serif SC Local', 'Noto Serif SC', 'Noto Serif CJK SC', 'Songti SC', serif;
    animation: noteIn .38s cubic-bezier(.2,.7,.2,1) both; }
  .note[hidden] { display: none; }
  .note.out { animation: noteOut .22s ease both; }
  @keyframes noteIn { from { opacity: 0; transform: translateY(10px); } }
  @keyframes noteOut { to { opacity: 0; transform: translateY(6px); } }
  .note .br { position: absolute; width: 30px; height: 30px; pointer-events: none; animation: brIn .45s cubic-bezier(.2,.7,.2,1) both; }
  .note .br-tr { top: -9px; right: -9px; border-top: .7px solid #141414; border-right: .7px solid #141414; --dx: 6px; --dy: -6px; }
  .note .br-bl { bottom: -9px; left: -9px; border-bottom: .7px solid #141414; border-left: .7px solid #141414; --dx: -6px; --dy: 6px; }
  @keyframes brIn { from { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
  .note .sq { position: absolute; left: -5px; bottom: -5px; width: 5px; height: 5px; background: #141414; }
  .note-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 10px 0 16px; height: 28px; box-sizing: border-box; flex: none; }
  .note-date { font-family: 'IBM Plex Mono', monospace; font-weight: 300; font-size: 7px; letter-spacing: .12em; color: #6E6E6E; }
  .note-count { flex: 1; text-align: right; font-family: 'IBM Plex Mono', monospace; font-weight: 300; font-size: 7px; letter-spacing: .1em; color: #6E6E6E; }
  .note-count .d { display: inline-block; width: 3px; height: 3px; margin-left: 3px; border-radius: 50%; background: #C8C8C8; vertical-align: 1px; }
  .note-count .d.on { background: #141414; }
  .note-x { width: 22px; height: 22px; border: 0; background: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
  .note-pages { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior: contain; }
  .note-pages::-webkit-scrollbar { display: none; }
  .np { flex: 0 0 100%; min-width: 0; box-sizing: border-box; padding: 10px 18px 22px 16px; overflow-y: auto; scroll-snap-align: start; overscroll-behavior: contain; scrollbar-width: none; }
  .np::-webkit-scrollbar { display: none; }
  .np-meta { font-size: 7px; color: #8A8A8A; letter-spacing: .04em; }
  .np-title { margin: 7px 0 0; font-weight: 400; font-size: 16px; line-height: 1.45; letter-spacing: .02em; color: #141414; }
  .np-rule { width: 22px; height: .5px; margin: 11px 0 12px; background: #141414; }
  .np-body p { margin: 0 0 .9em; font-size: 10.5px; line-height: 2; letter-spacing: .03em; text-align: justify; }
  /* 待办：右上菜单弹出，跟便签一个样子；左右两页：今日提醒 / 添加提醒 */
  .todo { top: 76px; }
  .td-sec { display: flex; align-items: center; gap: 6px; margin: 14px 0 2px; font-family: 'IBM Plex Mono', monospace; font-weight: 300; font-size: 7px; letter-spacing: .14em; color: #6E6E6E; }
  .td-sec::after { content: ''; flex: 1; height: .5px; background: rgba(20,20,20,.14); }
  .td-row { position: relative; display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; border-bottom: .5px solid rgba(20,20,20,.07); }
  .td-box { flex: none; width: 11px; height: 11px; margin-top: 3px; padding: 0; border: .7px solid #141414; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .td-row.done .td-box { background: #141414; }
  .td-time { flex: none; width: 30px; padding-top: 4px; font-family: 'IBM Plex Mono', monospace; font-weight: 300; font-size: 7.5px; color: #6E6E6E; }
  .td-main { flex: 1; min-width: 0; }
  .td-title { font-size: 10.5px; line-height: 1.7; letter-spacing: .03em; color: #141414; word-break: break-all; }
  .td-row.done .td-title { color: #9A9A9A; text-decoration: line-through; text-decoration-thickness: .5px; }
  .td-note { font-size: 8px; line-height: 1.6; color: #8A8A8A; word-break: break-all; }
  .td-rep { flex: none; padding-top: 4px; font-size: 7px; color: #8A8A8A; }
  .td-ask { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; gap: 12px; background: rgba(252,252,250,.97); font-size: 8.5px; color: #6E6E6E; }
  .td-ask button { padding: 4px 2px; border: 0; background: none; font-family: inherit; font-size: 9.5px; color: #141414; cursor: pointer; }
  .td-ask .del { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: .5px; }
  .td-empty { padding: 7px 0; font-size: 8.5px; color: #9A9A9A; }
  .td-next { display: flex; gap: 8px; padding: 4px 0; font-size: 8.5px; color: #6E6E6E; }
  .td-next b { flex: none; width: 58px; font-family: 'IBM Plex Mono', monospace; font-weight: 300; font-size: 7px; padding-top: 1px; }
  .td-next span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .td-next i { flex: none; font-style: normal; font-size: 7px; color: #9A9A9A; }
  .td-hint { margin-top: 14px; font-size: 7.5px; line-height: 1.7; color: #8A8A8A; }
  .td-hint.err { color: #141414; }
  .tf { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 4px 0; border-bottom: .5px solid rgba(20,20,20,.1); }
  .tf > span { flex: none; width: 30px; font-family: 'IBM Plex Mono', monospace; font-weight: 300; font-size: 7px; letter-spacing: .12em; color: #6E6E6E; }
  .tf input { flex: 1; min-width: 0; margin: 0; padding: 0; border: 0; border-radius: 0; background: none; outline: none; -webkit-appearance: none; appearance: none;
    font-family: inherit; font-size: 10.5px; color: #141414; -webkit-user-select: text; user-select: text; }
  .tf input::placeholder { color: #B0B0B0; }
  .tf input[type=date], .tf input[type=time] { flex: none; font-family: 'IBM Plex Mono', monospace; font-weight: 300; font-size: 9px; text-align: left; }
  .pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .pill { padding: 2px 6px; border: .5px solid rgba(20,20,20,.25); background: none; font-family: inherit; font-size: 8px; color: #141414; cursor: pointer; }
  .pill.on { background: #141414; border-color: #141414; color: #FCFCFA; }
  .td-add { width: 100%; height: 30px; margin-top: 16px; border: .7px solid #141414; background: none; font-family: inherit; font-size: 10.5px; letter-spacing: .3em; color: #141414; cursor: pointer; }
  .td-cancel { display: block; margin: 8px auto 0; padding: 4px 8px; border: 0; background: none; font-family: inherit; font-size: 8.5px; color: #8A8A8A; cursor: pointer; }
  .td-cancel[hidden] { display: none; }
  .td-add:disabled { opacity: .35; cursor: default; }
  /* 夜里（#3617–3629 她定的）：底 #242428，字浅灰，泪和字海 #0B4CF2；三张小单子同一套 */
  html.night, html.night body, html.night .frame { background: #242428; }
  html.night .ui, html.night .date { color: #CFCFD1; }
  html.night .day, html.night .page, html.night .count { color: #8C8C8E; }
  html.night .fall { color: #B4B4B6; }
  html.night .icon svg, html.night .note-x svg { stroke: #EBEBED; }
  html.night .cal, html.night .note { background: #2C2C31; border-color: rgba(233,232,228,.12); color: #CFCFD1; }
  html.night .cal-nav, html.night .cal-day, html.night .cal-head { color: #CFCFD1; }
  html.night .cal-week, html.night .cal-day.empty { color: #6E6E72; }
  html.night .cal-day:disabled { color: #48484D; }
  html.night .cal-day.sel span { background: #CFCFD1; color: #242428; }
  html.night .cal-day.today span { box-shadow: inset 0 0 0 .5px #CFCFD1; }
  html.night .cal-day i b { background: #CFCFD1; }
  html.night .note .br-tr, html.night .note .br-bl { border-color: #CFCFD1; }
  html.night .note .sq, html.night .np-rule { background: #CFCFD1; }
  html.night .note-date, html.night .note-count, html.night .np-meta, html.night .td-sec, html.night .td-time, html.night .tf > span { color: #8C8C8E; }
  html.night .note-count .d { background: #4A4A50; }
  html.night .note-count .d.on { background: #CFCFD1; }
  html.night .np-title, html.night .td-title, html.night .tf input, html.night .pill, html.night .td-add, html.night .td-ask button { color: #CFCFD1; }
  html.night .td-sec::after { background: rgba(233,232,228,.14); }
  html.night .td-row { border-bottom-color: rgba(233,232,228,.08); }
  html.night .tf { border-bottom-color: rgba(233,232,228,.1); }
  html.night .td-box, html.night .td-add { border-color: #CFCFD1; }
  html.night .td-row.done .td-box { background: #CFCFD1; }
  html.night .td-box svg { stroke: #242428; }
  html.night .td-row.done .td-title, html.night .td-empty, html.night .td-note, html.night .td-rep, html.night .td-hint, html.night .td-next, html.night .td-next i, html.night .td-cancel { color: #7A7A80; }
  html.night .td-hint.err { color: #CFCFD1; }
  html.night .td-ask { background: rgba(44,44,49,.97); color: #8C8C8E; }
  html.night .pill { border-color: rgba(233,232,228,.25); }
  html.night .pill.on { background: #CFCFD1; border-color: #CFCFD1; color: #242428; }
  html.night .tf input::placeholder { color: #5E5E64; }
  html.night .tf input[type=date], html.night .tf input[type=time] { color-scheme: dark; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <canvas id="sea" aria-hidden="true"></canvas>
  <canvas id="c" role="img" aria-label="一张侧脸的黑白照片，眼泪由文字组成，顺着鼻侧流下，滴进下方由日记文字组成的字海。按住眼泪可以挡住它，划过会把字顺着手的方向带走，划过字海会让字像隔着水一样荡开波纹。"></canvas>
  <button class="icon" id="backBtn" style="left:9px;top:40px" aria-label="返回">
    <svg width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="#141414" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2 L2.5 9 L9.5 16"/></svg>
  </button>
  <div class="ui title">Diary</div>
  <button class="icon" id="menuBtn" style="left:338px;top:40px" aria-label="菜单">
    <svg width="22" height="12" viewBox="0 0 22 12" fill="none" stroke="#141414" stroke-width="1" stroke-linecap="round" aria-hidden="true"><path d="M1 1.5 H21 M1 6 H21 M1 10.5 H21"/></svg>
  </button>
  <button class="ui date" id="dateBtn" aria-haspopup="true" aria-expanded="false" aria-label="选择日期">10.10</button>
  <div class="ui day" id="dayLbl">SATURDAY</div>
  <div class="ui page" id="pageLbl">· 第 166 篇</div>
  <div class="ui count" id="countLbl">165 篇 · 4,713 字</div>

  <div class="cal" id="cal" role="dialog" aria-label="选择日期" hidden>
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" aria-label="上个月">‹</button>
      <span id="calTitle">OCT 2026</span>
      <button class="cal-nav" id="calNext" aria-label="下个月">›</button>
    </div>
    <div class="cal-week"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <section class="note" id="note" role="dialog" aria-label="日记全文" hidden>
    <i class="br br-tr" aria-hidden="true"></i><i class="br br-bl" aria-hidden="true"></i><i class="sq" aria-hidden="true"></i>
    <div class="note-top">
      <span class="note-date" id="noteDate">10.10 · SAT</span>
      <span class="note-count" id="noteCount"></span>
      <button class="note-x" id="noteX" aria-label="关闭">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#141414" stroke-width="1" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 L8.5 8.5 M8.5 1.5 L1.5 8.5"/></svg>
      </button>
    </div>
    <div class="note-pages" id="notePages"></div>
  </section>
  <section class="note todo" id="todo" role="dialog" aria-label="待办" hidden>
    <i class="br br-tr" aria-hidden="true"></i><i class="br br-bl" aria-hidden="true"></i><i class="sq" aria-hidden="true"></i>
    <div class="note-top">
      <span class="note-date" id="todoDate">10.10 · SAT</span>
      <span class="note-count" id="todoCount"></span>
      <button class="note-x" id="todoX" aria-label="关闭">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#141414" stroke-width="1" stroke-linecap="round" aria-hidden="true"><path d="M1.5 1.5 L8.5 8.5 M8.5 1.5 L1.5 8.5"/></svg>
      </button>
    </div>
    <div class="note-pages" id="todoPages">
      <article class="np" aria-label="今日提醒">
        <div class="np-meta" id="tdMeta">今日</div>
        <h2 class="np-title">今日提醒</h2>
        <div class="np-rule"></div>
        <div id="tdList"></div>
      </article>
      <article class="np" aria-label="添加提醒">
        <div class="np-meta" id="tfMeta">新的一条 · 标成「我加的」</div>
        <h2 class="np-title" id="tfHead">添加提醒</h2>
        <div class="np-rule"></div>
        <label class="tf"><span>事项</span><input type="text" id="tfTitle" placeholder="要提醒什么…" maxlength="80" autocomplete="off"></label>
        <div class="tf"><span>日期</span><input type="date" id="tfDay"></div>
        <div class="tf"><span>全天</span><div class="pills"><button type="button" class="pill" id="tfAll">全天</button></div></div>
        <div class="tf" id="tfTimeRow"><span>时间</span><input type="time" id="tfTime" value="09:30"></div>
        <div class="tf"><span>重复</span><div class="pills" id="tfRep"></div></div>
        <div class="tf"><span>提醒</span><div class="pills" id="tfAlert"></div></div>
        <label class="tf"><span>备注</span><input type="text" id="tfNote" placeholder="可不填" maxlength="200" autocomplete="off"></label>
        <button type="button" class="td-add" id="tfAdd" disabled>添加</button>
        <button type="button" class="td-cancel" id="tfCancel" hidden>不改了</button>
        <div class="td-hint" id="tfHint">到点后台告诉陈璟</div>
      </article>
    </div>
  </section>
  <div class="ui fall">let it fall…</div>
  <p class="sr-only" id="todayText"></p>
</div>

  // 字海只用细的（300），泪和眼眶只用粗的（400）；一页 16×16 格，不够就再开一页
  const FS = 56, CELL = 76, COLS = 16, PER = COLS * COLS;
  const pages = [], glyphOf = new Map();
  let slots = 0;
  function addGlyphs(text, wt) {
    for (const ch of new Set([...text])) {
      if (glyphOf.has(ch + wt)) continue;
      const pi = Math.floor(slots / PER), n = slots % PER;
      if (!pages[pi]) {
        const cv = document.createElement('canvas');
        cv.width = cv.height = COLS * CELL;
        const c = cv.getContext('2d');
        c.textAlign = 'center'; c.textBaseline = 'middle';
        pages[pi] = c;
      }
      const ac = pages[pi], sx = (n % COLS) * CELL, sy = Math.floor(n / COLS) * CELL;
      ac.font = `${wt} ${FS}px ${FONT}`; ac.fillStyle = INK;
      ac.fillText(ch, sx + CELL / 2, sy + CELL / 2 + FS * .04);
      glyphOf.set(ch + wt, [ac.canvas, sx, sy]);
      slots++;
    }
  }

  function catmull(ps, n) {
    const out = [], q = [ps[0], ...ps, ps[ps.length - 1]];
    for (let i = 1; i < q.length - 2; i++) {
      const p0 = q[i - 1], p1 = q[i], p2 = q[i + 1], p3 = q[i + 2];
      for (let s = 0; s < n; s++) {
        const t = s / n, t2 = t * t, t3 = t2 * t;
        out.push([0, 1, 2].map(j => .5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
      }
    }
    out.push(q[q.length - 2]);
    return out;
  }

    let best = 1e9;
    for (let i = 0; i < path.n; i += 6) best = Math.min(best, Math.hypot(path.X[i] - x, path.Y[i] - y) - path.Wd[i] / 2);
    for (const p of G.lid) best = Math.min(best, Math.hypot(p[0] - x, p[1] - y) - 8);
    return best;
  }
  let pressTimer = 0, pressAt = null;
  const cancelPress = () => { clearTimeout(pressTimer); pressTimer = 0; pressAt = null; };
  canvas.addEventListener('pointerdown', e => {
    if (canvas.setPointerCapture) try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    const [x, y] = toDesign(e);
    closeCal();
    cancelPress();
    if (noteOpen || todoOpen) return;
    if (stream.length && nearTear(x, y) < 22) {
      pressAt = [x, y];
      pressTimer = setTimeout(() => { pressTimer = 0; finger.on = false; finger.hist = []; openNote(); }, 520);
    }
    Object.assign(finger, { on: true, x, y, vx: 0, vy: 0, hist: [[performance.now(), x, y]] });
    if (y > SEA_TOP) { addRipple(x, y, .85); finger.sx = x; finger.sy = y; }
  });
  canvas.addEventListener('pointermove', e => {
    const [x, y] = toDesign(e), now = performance.now();
    if (noteOpen || todoOpen) return;
    if (pressAt && Math.hypot(x - pressAt[0], y - pressAt[1]) > 12) cancelPress();
    if (e.pointerType === 'mouse' && !finger.on) Object.assign(finger, { on: true, x, y, vx: 0, vy: 0, hist: [] });
    if (!finger.on) return;
    const px = finger.x, py = finger.y, h = finger.hist;
    h.push([now, x, y]);
    while (h.length > 2 && now - h[0][0] > 90) h.shift();
    const span = Math.max(8, now - h[0][0]) / 1000;
    const vx = (x - h[0][1]) / span, vy = (y - h[0][2]) / span, sp = Math.hypot(vx, vy);
    if (sp >= FAST) carryAlong(px, py, x, y, vx, vy, sp);
    finger.x = x; finger.y = y;
  });
  const lift = e => { cancelPress(); if (e.pointerType !== 'mouse' || e.type === 'pointerleave') finger.on = false; };
  canvas.addEventListener('pointerup', lift);
  canvas.addEventListener('pointercancel', lift);
  canvas.addEventListener('pointerleave', lift);

  /* ---------- 日期、页码 ---------- */
  let draining = false, drainT = 0, pendingKey = null, lidDry = 1, lastLabel = '';
  const WD = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
  const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return { y, m: m - 1, d, wd: new Date(Date.UTC(y, m - 1, d)).getUTCDay() }; };
  const mmdd = k => { const t = parseKey(k); return `${String(t.m + 1).padStart(2, '0')}.${String(t.d).padStart(2, '0')}`; };
  const dateBtn = document.getElementById('dateBtn'), dayLbl = document.getElementById('dayLbl'), pageLbl = document.getElementById('pageLbl');
  document.getElementById('countLbl').textContent = `${pageNo} 篇 · ${charTotal.toLocaleString('en-US')} 字`;
  function setDay(key) {
    curKey = key;
    buildStream(key);
    TODAY = stream.filter(Boolean).join('');
    addGlyphs(TODAY, 400);
    document.getElementById('todayText').textContent = (DIARY[key] || []).map(e => e.text).join('\n');
    const t = parseKey(key);
    dateBtn.textContent = mmdd(key);
    dayLbl.textContent = WD[t.wd];
    lastLabel = '';
  }
  function updateLabels() {
    const key = draining ? pendingKey : curKey, list = DIARY[key] || [];
    let html;
    if (!list.length) html = '· 这一天没有日记';
    else {
      const p0 = PAGE_OF[key], p1 = p0 + list.length - 1, cur = draining ? -1 : curEntry();
      html = `· 第 ${p0 === p1 ? p0 : p0 + '–' + p1} 篇` + (list.length > 1 ? `<span class="dots">${list.map((_, i) => i === cur ? '●' : '○').join('')}</span>` : '');
    }
    if (html !== lastLabel) { pageLbl.innerHTML = html; lastLabel = html; }
  }
  function selectDay(key) {
    if (key === curKey && !draining) return;
    pendingKey = key;
    try { document.fonts.load(`400 48px "Serif SC Local"`, stripText((DIARY[key] || []).map(e => e.text).join(''))); } catch (e) {}
    if (!draining) { draining = true; drainT = T; }
    dateBtn.textContent = mmdd(key); dayLbl.textContent = WD[parseKey(key).wd];
  }

  /* ---------- 月历 ---------- */
  const cal = document.getElementById('cal'), calGrid = document.getElementById('calGrid'), calTitle = document.getElementById('calTitle');
  const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const FIRST = parseKey(DAY_KEYS[0]), LAST = parseKey(TODAY_KEY);
  let viewY = LAST.y, viewM = LAST.m;
  function renderCal() {

    document.getElementById('calPrev').disabled = viewY * 12 + viewM <= FIRST.y * 12 + FIRST.m;
    document.getElementById('calNext').disabled = viewY * 12 + viewM >= LAST.y * 12 + LAST.m;
    const first = (new Date(Date.UTC(viewY, viewM, 1)).getUTCDay() + 6) % 7, days = new Date(Date.UTC(viewY, viewM + 1, 0)).getUTCDate();
    let h = '';
    for (let i = 0; i < first; i++) h += '<span></span>';
    for (let d = 1; d <= days; d++) {
      const k = `${viewY}-${String(viewM + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const n = (DIARY[k] || []).length, future = k > TODAY_KEY, before = k < DAY_KEYS[0];
      const cls = ['cal-day', n ? '' : 'empty', k === curKey ? 'sel' : '', k === TODAY_KEY ? 'today' : ''].join(' ');
      h += `<button class="${cls}" data-k="${k}" ${future || before ? 'disabled' : ''} aria-label="${viewM + 1}月${d}日，${n ? n + ' 篇日记' : '没有日记'}"><span>${d}</span>${n ? `<i>${'<b></b>'.repeat(Math.min(n, 3))}</i>` : ''}</button>`;
    }
    calGrid.innerHTML = h;
  }
  function openCal() {
    const t = parseKey(curKey); viewY = t.y; viewM = t.m; renderCal(); cal.hidden = false; dateBtn.setAttribute('aria-expanded', 'true');
    // 放大以后矮屏上会掉出页面底：放不下就往上提

  }
  function closeCal() { if (!cal.hidden) { cal.hidden = true; dateBtn.setAttribute('aria-expanded', 'false'); } }
  dateBtn.addEventListener('click', () => { if (noteOpen || todoOpen) return; cal.hidden ? openCal() : closeCal(); });
  document.getElementById('calPrev').addEventListener('click', () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderCal(); });
  document.getElementById('calNext').addEventListener('click', () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderCal(); });
  let userPicked = false;
  calGrid.addEventListener('click', e => { const b = e.target.closest('.cal-day'); if (!b || b.disabled) return; closeCal(); userPicked = true; selectDay(b.dataset.k); });

  /* ---------- 便签：长按泪弹出这一天的全文 ---------- */
  const note = document.getElementById('note'), notePages = document.getElementById('notePages'), noteCount = document.getElementById('noteCount');
  let noteOpen = false;
  const esc = t => t.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function paragraphs(text) {
    const ss = text.match(/[^。！？]+[。！？]?/g) || [text], out = [];
    for (let i = 0; i < ss.length; i += 3) out.push(ss.slice(i, i + 3).join(''));

  }
  function setNoteDots(i) {
    const list = DIARY[curKey] || [];

  }

  }
  document.getElementById('noteX').addEventListener('click', closeNote);
  notePages.addEventListener('scroll', () => setNoteDots(Math.round(notePages.scrollLeft / Math.max(1, notePages.clientWidth))), { passive: true });
  function placeNote(fh) {
    note.style.height = Math.max(240, Math.min(400, fh - 343 - 74)) + 'px';
  }
  window.__placeNote = placeNote;

  function setNight(on) {
    NIGHT = on; INK = on ? INK_NIGHT : INK_DAY; BG = on ? BG_NIGHT : BG_DAY; SEA_DARK = on ? 1.9 : 1.12;

  }
  document.querySelector('.fall').addEventListener('click', () => setNight(!NIGHT));

  // 1010 #3634：原生先拿上回存的日记把页面画出来，后台拉到新的再从这里塞进来：
  // 篇数字数重算；今天刚写了、她又没自己挑过日子，就流到今天；正在看的那天内容变了，就重新流一遍
  window.__diaryUpdate = d => {
    if (!d || typeof d !== 'object') return;
    const before = JSON.stringify(DIARY[curKey] || []);
    for (const k of Object.keys(DIARY)) delete DIARY[k];
    Object.assign(DIARY, d);
    DAY_KEYS.splice(0, DAY_KEYS.length, ...Object.keys(DIARY).sort());
    recount(); lastLabel = '';
    if (!userPicked && DIARY[TODAY_KEY] && curKey !== TODAY_KEY) selectDay(TODAY_KEY);
    else if (JSON.stringify(DIARY[curKey] || []) !== before) { pendingKey = curKey; if (!draining) { draining = true; drainT = T; } }
    if (!cal.hidden) renderCal();
  };

  /* ---------- 待办：右上菜单 → 今日提醒 / 添加提醒；数据和增删改都交给原生（App 里 thTodo*） ---------- */
  const $ = id => document.getElementById(id);
  const todo = $('todo'), todoPages = $('todoPages'), tdList = $('tdList');
  let todoOpen = false, todoData = null, askRid = null, askTimer = 0, askAt = null;
  const CHECK = '<svg width="7" height="6" viewBox="0 0 7 6" fill="none" stroke="#FCFCFA" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3 L2.8 4.8 L6 1.2"/></svg>';
  function setTodoDots(i) {
    $('todoCount').innerHTML = `${i + 1} / 2` + [0, 1].map(j => `<span class="d${j === i ? ' on' : ''}"></span>`).join('');
  }
  function todoRow(x) {
    return `<div class="td-row${x.done ? ' done' : ''}" data-rid="${esc(x.rid)}" data-day="${esc(x.day)}">
      <button class="td-box" aria-label="${x.done ? '标成没做' : '标成做完了'}">${x.done ? CHECK : ''}</button>
      <span class="td-time">${esc(x.time || '全天')}</span>
      <div class="td-main"><div class="td-title">${esc(x.title)}</div>${x.note ? `<div class="td-note">${esc(x.note)}</div>` : ''}</div>
      ${x.rep ? `<span class="td-rep">${esc(x.rep)}</span>` : ''}
      ${askRid === x.rid ? `<div class="td-ask"><button class="edit">编辑</button><button class="del">${x.rep ? '删掉（整串）' : '删掉'}</button><button class="keep">算了</button></div>` : ''}
    </div>`;
  }
  function renderTodo() {
    const today = (todoData && todoData.today) || TODAY_KEY, list = todoData ? todoData.items : null;
    $('todoDate').textContent = `${mmdd(today)} · ${WD[parseKey(today).wd].slice(0, 3)}`;
    $('tdMeta').textContent = list ? `${mmdd(today)} · ${list.length} 件 · ${list.filter(x => x.done).length} 件做完` : '…';
    if (!list) { tdList.innerHTML = '<div class="td-empty">正在拿…</div>'; return; }
    const sec = (label, xs) => `<div class="td-sec">${label} · ${xs.length}</div>` + (xs.length ? xs.map(todoRow).join('') : '<div class="td-empty">今天没有</div>');
    let h = sec('我加的', list.filter(x => !x.him)) + sec('陈璟加的', list.filter(x => x.him));
    const next = (todoData.next || []).filter(x => x.day > today).slice(0, 3);
    if (next.length) h += '<div class="td-sec">接下来</div>' + next.map(x =>
      `<div class="td-next"><b>${mmdd(x.day)} ${esc(x.time || '全天')}</b><span>${esc(x.title)}</span><i>${x.him ? '陈璟' : '我'}</i></div>`).join('');
    h += '<div class="td-hint">点方框打勾 · 长按一条编辑或删掉 · 往左滑添加</div>';

  }
  function openTodo() {
    closeCal(); closeNote();
    todo.hidden = false; todo.classList.remove('out'); todoOpen = true;
    finger.on = false; finger.hist = [];
    askRid = null;
    todoPages.scrollLeft = 0; setTodoDots(0);
    if (!tfDay.value) { tfDay.value = TODAY_KEY; tfDay.min = TODAY_KEY; }

    post({ type: 'todo' });
  }
  function closeTodo() {
    if (!todoOpen) return;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

  }
  window.__openTodo = openTodo;
  window.__todo = d => { todoData = d; if (askRid && !d.items.some(x => x.rid === askRid)) askRid = null; renderTodo(); };
  $('todoX').addEventListener('click', closeTodo);
  todoPages.addEventListener('scroll', () => setTodoDots(Math.round(todoPages.scrollLeft / Math.max(1, todoPages.clientWidth))), { passive: true });
  const findItem = row => todoData && todoData.items.find(x => x.rid === row.dataset.rid && x.day === row.dataset.day);
  tdList.addEventListener('click', e => {
    const row = e.target.closest('.td-row'); if (!row) return;
    const x = findItem(row); if (!x) return;
    if (e.target.closest('.edit')) {
      askRid = null; renderTodo(); startEdit(x);
    } else if (e.target.closest('.del')) {
      askRid = null; todoData.items = todoData.items.filter(y => y.rid !== x.rid); renderTodo();
      post({ type: 'todoDelete', rid: x.rid });
    } else if (e.target.closest('.keep')) {
      askRid = null; renderTodo();
    } else if (e.target.closest('.td-box') && !askRid) {
      x.done = !x.done; renderTodo();
      post({ type: 'todoDone', rid: x.rid, day: x.day, done: x.done });
    }
  });
  const cancelAsk = () => { clearTimeout(askTimer); askTimer = 0; askAt = null; };
  tdList.addEventListener('pointerdown', e => {
    cancelAsk();
    const row = e.target.closest('.td-row');
    if (!row || e.target.closest('.td-box') || e.target.closest('.td-ask')) return;
    askAt = [e.clientX, e.clientY];
    askTimer = setTimeout(() => { askTimer = 0; askRid = row.dataset.rid; renderTodo(); post({ type: 'haptic' }); }, 520);
  });
  tdList.addEventListener('pointermove', e => { if (askAt && Math.hypot(e.clientX - askAt[0], e.clientY - askAt[1]) > 10) cancelAsk(); });
  tdList.addEventListener('pointerup', cancelAsk);
  tdList.addEventListener('pointercancel', cancelAsk);

  // 添加：跟原来新建提醒那张卡一样的几样——事项、日期、全天、时间、重复、提前多久、备注
  const tfTitle = $('tfTitle'), tfDay = $('tfDay'), tfTime = $('tfTime'), tfNote = $('tfNote'), tfAdd = $('tfAdd'), tfHint = $('tfHint'), tfAll = $('tfAll');
  const REPS = [['none', '不重复'], ['daily', '每天'], ['weekly', '每周'], ['monthly', '每月'], ['yearly', '每年']];
  const ALERTS = [[0, '准时'], [60, '提前1小时'], [1440, '提前1天']];
  let tfRep = 'none', tfAlert = 60, tfAllDay = false, tfSaving = false, editing = null;
  const repPills = () => pills($('tfRep'), REPS, tfRep, v => { tfRep = v; });
  const alertPills = () => pills($('tfAlert'), ALERTS, tfAlert, v => { tfAlert = v; });
  const setAllDay = on => { tfAllDay = on; tfAll.classList.toggle('on', on); $('tfTimeRow').style.display = on ? 'none' : ''; };
  // 编辑：第二页换成「编辑提醒」带入原来的内容；后端只能整串改，重复的没动日期就不送 day（免得把起始那天挪走）
  function startEdit(x) {
    editing = x;
    tfTitle.value = x.title; tfNote.value = x.note || '';
    tfDay.min = ''; tfDay.value = x.day;
    setAllDay(!x.time); if (x.time) tfTime.value = x.time;
    tfRep = x.repeat || 'none'; tfAlert = x.alert || 0;
    if (!ALERTS.some(([v]) => v === tfAlert)) ALERTS.push([tfAlert, `提前${tfAlert}分钟`]);
    repPills(); alertPills();
    $('tfHead').textContent = '编辑提醒';
    $('tfMeta').textContent = x.rep ? `${x.him ? '陈璟' : '我'}加的 · ${x.rep}重复，改的是整串` : `${x.him ? '陈璟' : '我'}加的`;
    tfAdd.textContent = '保存'; $('tfCancel').hidden = false;
    tfHint.classList.remove('err'); tfHint.textContent = '到点后台告诉陈璟';
    tfCheck();
    todoPages.scrollTo({ left: todoPages.clientWidth, behavior: 'smooth' });
  }
  function endEdit() {
    editing = null;
    tfTitle.value = ''; tfNote.value = '';
    tfDay.value = TODAY_KEY; tfDay.min = TODAY_KEY;
    setAllDay(false); tfTime.value = '09:30';
    tfRep = 'none'; tfAlert = 60; repPills(); alertPills();
    $('tfHead').textContent = '添加提醒'; $('tfMeta').textContent = '新的一条 · 标成「我加的」';
    tfAdd.textContent = '添加'; $('tfCancel').hidden = true;
    tfHint.classList.remove('err'); tfHint.textContent = '到点后台告诉陈璟';
    tfCheck();
  }
  function pills(el, opts, cur, set) {
    el.innerHTML = opts.map(([v, t]) => `<button type="button" class="pill${v === cur ? ' on' : ''}" data-v="${v}">${t}</button>`).join('');
    el.onclick = e => { const b = e.target.closest('.pill'); if (!b) return; const o = opts.find(([v]) => String(v) === b.dataset.v); set(o[0]); pills(el, opts, o[0], set); };
  }
  repPills(); alertPills();
  tfAll.addEventListener('click', () => setAllDay(!tfAllDay));
  $('tfCancel').addEventListener('click', () => { endEdit(); todoPages.scrollTo({ left: 0, behavior: 'smooth' }); });
  const tfCheck = () => { tfAdd.disabled = tfSaving || !tfTitle.value.trim() || !tfDay.value; };
  tfTitle.addEventListener('input', tfCheck); tfDay.addEventListener('change', tfCheck);
  tfAdd.addEventListener('click', () => {
    if (tfAdd.disabled) return;
    tfSaving = true; tfCheck(); tfAdd.textContent = '…';
    tfHint.classList.remove('err'); tfHint.textContent = '到点后台告诉陈璟';
    const body = { title: tfTitle.value.trim(), day: tfDay.value, time: tfAllDay ? '' : (tfTime.value || '09:30'), all_day: tfAllDay,
                   repeat: tfRep, alert_min: tfAlert, note: tfNote.value.trim() };
    if (editing) {
      body.id = editing.rid;
      if (editing.repeat && editing.repeat !== 'none' && tfDay.value === editing.day) delete body.day;
      post({ type: 'todoEdit', body });
    } else {
      body.author = 'user';
      post({ type: 'todoAdd', body });
    }
  });
  window.__todoAdded = err => {
    tfSaving = false; tfAdd.textContent = editing ? '保存' : '添加';
    if (err) { tfHint.classList.add('err'); tfHint.textContent = err; tfCheck(); return; }
    if (editing) endEdit();
    tfTitle.value = ''; tfNote.value = ''; tfCheck();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    todoPages.scrollTo({ left: 0, behavior: 'smooth' });
  };
  placeNote(H / 2);
  setDay(curKey);

  /* ---------- 每一步 ---------- */
  function step(dt) {
    T += dt;
    {
      const now = performance.now(), h = finger.hist;
      while (h.length > 2 && now - h[0][0] > 90) h.shift();
      if (finger.on && h.length >= 2 && now - h[h.length - 1][0] < 70) {
        const a = h[0], b = h[h.length - 1], span = Math.max(8, b[0] - a[0]) / 1000;
        finger.vx = (b[1] - a[1]) / span; finger.vy = (b[2] - a[2]) / span;
      } else { finger.vx = 0; finger.vy = 0; }
    }
    const speed = Math.hypot(finger.vx, finger.vy);
    const holding = finger.on && speed < FAST;

    lidDry += ((stream.length ? 1 : .35) - lidDry) * Math.min(1, dt * 2.5);
    updateLabels();
    // 眼眶：微微颤动，隔一会儿换一个字
    for (const c of lid) {
      if (T >= c.swap) {
        if (!c.swapped && T >= c.swap + .3) { c.g = glyphOf.get(lidChar(lidK++) + '400'); c.swapped = true; }
        if (T >= c.swap + .6) { c.swap = T + R(2.5, 6); c.swapped = false; }
      }
    }

    // 换日期：整条加速流下去，全部落进字海，再换成新一天的字
    if (draining && (T - drainT > 2.2 || !tear.some(c => c.g && c.vis > .2))) {
      for (const c of tear) if (c.g && c.vis > .3) { look(c, 0); toFall(c, R(-8, 8), 60, R(-.6, .6)); }
      tear.length = 0; draining = false; lastRow = null;
      setDay(pendingKey);
    }
    // 新的一行从眼角渗出来（这一天没有日记就不流）
    if (!draining && stream.length) {
      if (!lastRow) spawnRow(0);
      lastRow.s += speedAt(0) * dt;
      while (lastRow.s >= lastRow.gap) spawnRow(lastRow.s - lastRow.gap);
    }
    if (!stream.length) lastRow = null;

    for (let n = tear.length - 1; n >= 0; n--) {
      const c = tear[n];
      let ds = speedAt(c.s / path.total) * dt * (draining ? 4.5 : 1), blocked = false;
      if (holding && !draining && c.vis > .05 && c.s >= S_FREE) {
        const ni = at(c.s + ds), off = c.off + c.e;
        const cx = path.X[ni] - path.TY[ni] * off, cy = path.Y[ni] + path.TX[ni] * off;
        const dx = cx - finger.x, dy = cy - finger.y;
        if (Math.hypot(dx, dy) < RB) {
          blocked = true; ds = 0;
          let side = dx * -path.TY[ni] + dy * path.TX[ni];
          side = Math.abs(side) < 1 ? (c.off >= 0 ? 1 : -1) : Math.sign(side);
          c.e += side * 55 * dt;
        }
      }
      if (!blocked) c.e *= Math.exp(-dt * 1.4);
      c.e = clamp(c.e, -RB - 12, RB + 12);
      c.s += ds;
      if (c.s >= path.total) {
        look(c, 0);
        if (c.g && c.vis > .5) {
          const v = speedAt(1), i = path.n - 1;
          c.size *= 1.15; c.alpha = Math.max(c.alpha, .9);
          if (draining) toFall(c, path.TX[i] * v + R(-3, 3), path.TY[i] * v, R(-.5, .5));
          else toFall(c, 0, LINE_V, 0, true);
        } else if (c.g && c.alpha > .02) {
          merging.push({ g: c.g, x0: c.x, y0: c.y, size0: c.size, rot: c.rot, a0: c.alpha, t0: T });
        }
        tear.splice(n, 1);
        continue;
      }
      look(c, dt);
    }

    for (let n = merging.length - 1; n >= 0; n--) if (T - merging[n].t0 > .5) merging.splice(n, 1);
    for (let n = free.length - 1; n >= 0; n--) {
      const f = free[n];
      if (f.sink >= 0) { if (T - f.sink > .45) free.splice(n, 1); continue; }
      if (!f.steady) f.vy = Math.min(f.vy + FALL_G * dt, FALL_MAX);
      f.vx *= Math.exp(-dt * 1.1);
      if (holding) {
        const dx = f.x - finger.x, dy = f.y - finger.y, d = Math.hypot(dx, dy);
        if (d < RB && d > .01) {
          const nx = dx / d, ny = dy / d;
          f.x = finger.x + nx * RB; f.y = finger.y + ny * RB;
          const vn = f.vx * nx + f.vy * ny;
          if (vn < 0) { f.vx -= vn * nx; f.vy -= vn * ny; }
          f.vx = f.vx * .94 + nx * 5; f.vy *= .94;
        }
      }
      f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.spin * dt;
      f.size = f.size0 * (1 - .22 * clamp((f.y - f.y0) / 220, 0, 1));
      if (f.vy > 0 && f.y >= f.land) {
        const z = clamp((f.land - SEA_TOP) / SEA_SPAN, 0, 1);
        f.sink = T; f.y = f.land; addRipple(f.x, f.land, clamp(f.size / 16, .55, 1) * (.75 + .5 * z) * (f.steady ? .5 : 1));   // 连成线以后每个字都砸，水花减半
      } else if (f.x < -60 || f.x > W + 60 || f.y > H + 40) free.splice(n, 1);
    }

    // 手在字海上划：沿轨迹一路荡开波纹
    if (finger.on && finger.y > SEA_TOP && Math.hypot(finger.x - finger.sx, finger.y - finger.sy) > 26) {
      addRipple(finger.x, finger.y, .62 + Math.min(.3, speed / 3500));
      finger.sx = finger.x; finger.sy = finger.y;
    }
    while (ripples.length && T - ripples[0].t > RIP_LIFE) ripples.shift();
  }

  /* ---------- 画 ---------- */
  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.setTransform(S, 0, 0, S, 0, 0);
    if (photoSrc.naturalWidth) ctx.drawImage(photoSrc, 0, G.PY, W, G.ph);

    for (const c of lid) {
      let a = c.a * lidDry;
      if (T >= c.swap && T < c.swap + .6) a *= Math.abs(T - c.swap - .3) / .3;          // 换字时淡出再淡入
      const wob = Math.sin(T * 2.1 + c.ph), wob2 = Math.cos(T * 1.6 + c.ph * 1.3);
      glyph(c.g, c.x + wob * .5, c.y + wob2 * .6, c.size * (1 + .03 * wob2), c.rot + wob * .05, a);
    }
    for (const c of tear) glyph(c.g, c.x, c.y, c.size, c.rot, c.alpha);
    for (const m of merging) {
      const k = Math.min(1, (T - m.t0) / .5), e = k * (2 - k);
      glyph(m.g, m.x0 + (TIP.x - m.x0) * e, m.y0 + (TIP.y + 4 - m.y0) * e, m.size0 * (1 - .6 * e), m.rot, m.a0 * (1 - k));
    }
    for (const f of free) {
      if (f.sink < 0) glyph(f.g, f.x, f.y, f.size, f.rot, f.alpha);
      else { const k = (T - f.sink) / .45; glyph(f.g, f.x, f.y + 3 * k, f.size * (1 - .35 * k), f.rot, f.alpha * (1 - k)); }
    }
    drawSea();
  }

  for (let i = 0; i < 26 * 30; i++) step(1 / 30);
  draw();
  requestAnimationFrame(() => { frame.classList.add('ready'); post({ type: 'ready' }); });
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    step(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
