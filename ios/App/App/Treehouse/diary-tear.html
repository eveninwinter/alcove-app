  }
  function openCal() { const t = parseKey(curKey); viewY = t.y; viewM = t.m; renderCal(); cal.hidden = false; dateBtn.setAttribute('aria-expanded', 'true'); }
  function closeCal() { if (!cal.hidden) { cal.hidden = true; dateBtn.setAttribute('aria-expanded', 'false'); } }
  dateBtn.addEventListener('click', () => { if (noteOpen || todoOpen) return; cal.hidden ? openCal() : closeCal(); });
  document.getElementById('calPrev').addEventListener('click', () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderCal(); });
  document.getElementById('calNext').addEventListener('click', () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderCal(); });
  calGrid.addEventListener('click', e => { const b = e.target.closest('.cal-day'); if (!b || b.disabled) return; closeCal(); selectDay(b.dataset.k); });

  /* ---------- 便签：长按泪弹出这一天的全文 ---------- */
  const note = document.getElementById('note'), notePages = document.getElementById('notePages'), noteCount = document.getElementById('noteCount');
  let noteOpen = false;
  const esc = t => t.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function paragraphs(text) {
    const ss = text.match(/[^。！？]+[。！？]?/g) || [text], out = [];
    for (let i = 0; i < ss.length; i += 3) out.push(ss.slice(i, i + 3).join(''));
    return out.map(p => `<p>${esc(p)}</p>`).join('');
  }
  function setNoteDots(i) {
    const list = DIARY[curKey] || [];
    noteCount.innerHTML = list.length > 1 ? `${i + 1} / ${list.length}` + list.map((_, j) => `<span class="d${j === i ? ' on' : ''}"></span>`).join('') : '';
  }
  function openNote() {
    const list = DIARY[curKey] || [];
    if (!list.length) return;
    const t = parseKey(curKey);
    document.getElementById('noteDate').textContent = `${mmdd(curKey)} · ${WD[t.wd].slice(0, 3)}`;
    notePages.innerHTML = list.map((e, i) => `<article class="np" aria-label="第 ${i + 1} 篇">
        <div class="np-meta">第 ${PAGE_OF[curKey] + i} 页 · ${esc(e.time)} · ${[...e.text].length} 字</div>
        <h2 class="np-title">${esc(titleOf(e))}</h2>
        <div class="np-rule"></div>
        <div class="np-body">${paragraphs(e.text)}</div>
      </article>`).join('');
    const start = Math.max(0, curEntry());
    note.hidden = false; note.classList.remove('out'); noteOpen = true; closeCal();
    notePages.scrollLeft = start * notePages.clientWidth;
    setNoteDots(start);
    if (navigator.vibrate) navigator.vibrate(8);
    post({ type: 'haptic' });
  }
  function closeNote() {
    if (!noteOpen) return;
    noteOpen = false; note.classList.add('out');
    setTimeout(() => { if (!noteOpen) note.hidden = true; }, 220);
  }
  document.getElementById('noteX').addEventListener('click', closeNote);
  notePages.addEventListener('scroll', () => setNoteDots(Math.round(notePages.scrollLeft / Math.max(1, notePages.clientWidth))), { passive: true });
  function placeNote(fh) {
    note.style.height = Math.max(240, Math.min(400, fh - 343 - 74)) + 'px';
  }
  window.__placeNote = placeNote;

  function setNight(on) {
    NIGHT = on; INK = on ? INK_NIGHT : INK_DAY; BG = on ? BG_NIGHT : BG_DAY; SEA_DARK = on ? 1.9 : 1.12;
    document.documentElement.classList.toggle('night', on);
    photoSrc = on && nightPhoto.naturalWidth ? nightPhoto : photo;
    recolorGlyphs();
    buildSea(); bakeSea(lastScale);
    post({ type: 'night', on });
  }
  document.querySelector('.fall').addEventListener('click', () => setNight(!NIGHT));

  /* ---------- 待办：右上菜单 → 今日提醒 / 添加提醒；数据和增删改都交给原生（App 里 thTodo*） ---------- */
  const $ = id => document.getElementById(id);
  const todo = $('todo'), todoPages = $('todoPages'), tdList = $('tdList');
  let todoOpen = false, todoData = null, askRid = null, askTimer = 0, askAt = null;
  const CHECK = '<svg width="7" height="6" viewBox="0 0 7 6" fill="none" stroke="#FCFCFA" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3 L2.8 4.8 L6 1.2"/></svg>';
  function setTodoDots(i) {
    $('todoCount').innerHTML = `${i + 1} / 2` + [0, 1].map(j => `<span class="d${j === i ? ' on' : ''}"></span>`).join('');
  }
  function todoRow(x) {
    return `<div class="td-row${x.done ? ' done' : ''}" data-rid="${esc(x.rid)}" data-day="${esc(x.day)}">
      <button class="td-box" aria-label="${x.done ? '标成没做' : '标成做完了'}">${x.done ? CHECK : ''}</button>
      <span class="td-time">${esc(x.time || '全天')}</span>
      <div class="td-main"><div class="td-title">${esc(x.title)}</div>${x.note ? `<div class="td-note">${esc(x.note)}</div>` : ''}</div>
      ${x.rep ? `<span class="td-rep">${esc(x.rep)}</span>` : ''}
      ${askRid === x.rid ? `<div class="td-ask"><button class="edit">编辑</button><button class="del">${x.rep ? '删掉（整串）' : '删掉'}</button><button class="keep">算了</button></div>` : ''}
    </div>`;
  }
  function renderTodo() {
    const today = (todoData && todoData.today) || TODAY_KEY, list = todoData ? todoData.items : null;
    $('todoDate').textContent = `${mmdd(today)} · ${WD[parseKey(today).wd].slice(0, 3)}`;
    $('tdMeta').textContent = list ? `${mmdd(today)} · ${list.length} 件 · ${list.filter(x => x.done).length} 件做完` : '…';
    if (!list) { tdList.innerHTML = '<div class="td-empty">正在拿…</div>'; return; }
    const sec = (label, xs) => `<div class="td-sec">${label} · ${xs.length}</div>` + (xs.length ? xs.map(todoRow).join('') : '<div class="td-empty">今天没有</div>');
    let h = sec('我加的', list.filter(x => !x.him)) + sec('陈璟加的', list.filter(x => x.him));
    const next = (todoData.next || []).filter(x => x.day > today).slice(0, 3);
    if (next.length) h += '<div class="td-sec">接下来</div>' + next.map(x =>
      `<div class="td-next"><b>${mmdd(x.day)} ${esc(x.time || '全天')}</b><span>${esc(x.title)}</span><i>${x.him ? '陈璟' : '我'}</i></div>`).join('');
    h += '<div class="td-hint">点方框打勾 · 长按一条编辑或删掉 · 往左滑添加</div>';
    tdList.innerHTML = h;
  }
  function openTodo() {
    closeCal(); closeNote();
    todo.hidden = false; todo.classList.remove('out'); todoOpen = true;
    finger.on = false; finger.hist = [];
    askRid = null;
    todoPages.scrollLeft = 0; setTodoDots(0);
    if (!tfDay.value) { tfDay.value = TODAY_KEY; tfDay.min = TODAY_KEY; }
    renderTodo();
    post({ type: 'todo' });
  }
  function closeTodo() {
    if (!todoOpen) return;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    todoOpen = false; todo.classList.add('out');
    if (editing) endEdit();
    setTimeout(() => { if (!todoOpen) todo.hidden = true; }, 220);
  }
  window.__openTodo = openTodo;
  window.__todo = d => { todoData = d; if (askRid && !d.items.some(x => x.rid === askRid)) askRid = null; renderTodo(); };
  $('todoX').addEventListener('click', closeTodo);
  todoPages.addEventListener('scroll', () => setTodoDots(Math.round(todoPages.scrollLeft / Math.max(1, todoPages.clientWidth))), { passive: true });
  const findItem = row => todoData && todoData.items.find(x => x.rid === row.dataset.rid && x.day === row.dataset.day);
  tdList.addEventListener('click', e => {
    const row = e.target.closest('.td-row'); if (!row) return;
    const x = findItem(row); if (!x) return;
    if (e.target.closest('.edit')) {
      askRid = null; renderTodo(); startEdit(x);
    } else if (e.target.closest('.del')) {
      askRid = null; todoData.items = todoData.items.filter(y => y.rid !== x.rid); renderTodo();
      post({ type: 'todoDelete', rid: x.rid });
    } else if (e.target.closest('.keep')) {
      askRid = null; renderTodo();
    } else if (e.target.closest('.td-box') && !askRid) {
      x.done = !x.done; renderTodo();
      post({ type: 'todoDone', rid: x.rid, day: x.day, done: x.done });
    }
  });
  const cancelAsk = () => { clearTimeout(askTimer); askTimer = 0; askAt = null; };
  tdList.addEventListener('pointerdown', e => {
    cancelAsk();
    const row = e.target.closest('.td-row');
    if (!row || e.target.closest('.td-box') || e.target.closest('.td-ask')) return;
    askAt = [e.clientX, e.clientY];
    askTimer = setTimeout(() => { askTimer = 0; askRid = row.dataset.rid; renderTodo(); post({ type: 'haptic' }); }, 520);
  });
  tdList.addEventListener('pointermove', e => { if (askAt && Math.hypot(e.clientX - askAt[0], e.clientY - askAt[1]) > 10) cancelAsk(); });
  tdList.addEventListener('pointerup', cancelAsk);
  tdList.addEventListener('pointercancel', cancelAsk);

  // 添加：跟原来新建提醒那张卡一样的几样——事项、日期、全天、时间、重复、提前多久、备注
  const tfTitle = $('tfTitle'), tfDay = $('tfDay'), tfTime = $('tfTime'), tfNote = $('tfNote'), tfAdd = $('tfAdd'), tfHint = $('tfHint'), tfAll = $('tfAll');
  const REPS = [['none', '不重复'], ['daily', '每天'], ['weekly', '每周'], ['monthly', '每月'], ['yearly', '每年']];
  const ALERTS = [[0, '准时'], [60, '提前1小时'], [1440, '提前1天']];
  let tfRep = 'none', tfAlert = 60, tfAllDay = false, tfSaving = false, editing = null;
  const repPills = () => pills($('tfRep'), REPS, tfRep, v => { tfRep = v; });
  const alertPills = () => pills($('tfAlert'), ALERTS, tfAlert, v => { tfAlert = v; });
  const setAllDay = on => { tfAllDay = on; tfAll.classList.toggle('on', on); $('tfTimeRow').style.display = on ? 'none' : ''; };
  // 编辑：第二页换成「编辑提醒」带入原来的内容；后端只能整串改，重复的没动日期就不送 day（免得把起始那天挪走）
  function startEdit(x) {
    editing = x;
    tfTitle.value = x.title; tfNote.value = x.note || '';
    tfDay.min = ''; tfDay.value = x.day;
    setAllDay(!x.time); if (x.time) tfTime.value = x.time;
    tfRep = x.repeat || 'none'; tfAlert = x.alert || 0;
    if (!ALERTS.some(([v]) => v === tfAlert)) ALERTS.push([tfAlert, `提前${tfAlert}分钟`]);
    repPills(); alertPills();
    $('tfHead').textContent = '编辑提醒';
    $('tfMeta').textContent = x.rep ? `${x.him ? '陈璟' : '我'}加的 · ${x.rep}重复，改的是整串` : `${x.him ? '陈璟' : '我'}加的`;
    tfAdd.textContent = '保存'; $('tfCancel').hidden = false;
    tfHint.classList.remove('err'); tfHint.textContent = '到点后台告诉陈璟';
    tfCheck();
    todoPages.scrollTo({ left: todoPages.clientWidth, behavior: 'smooth' });
  }
  function endEdit() {
    editing = null;
    tfTitle.value = ''; tfNote.value = '';
    tfDay.value = TODAY_KEY; tfDay.min = TODAY_KEY;
    setAllDay(false); tfTime.value = '09:30';
    tfRep = 'none'; tfAlert = 60; repPills(); alertPills();
    $('tfHead').textContent = '添加提醒'; $('tfMeta').textContent = '新的一条 · 标成「我加的」';
    tfAdd.textContent = '添加'; $('tfCancel').hidden = true;
    tfHint.classList.remove('err'); tfHint.textContent = '到点后台告诉陈璟';
    tfCheck();
  }
  function pills(el, opts, cur, set) {
    el.innerHTML = opts.map(([v, t]) => `<button type="button" class="pill${v === cur ? ' on' : ''}" data-v="${v}">${t}</button>`).join('');
    el.onclick = e => { const b = e.target.closest('.pill'); if (!b) return; const o = opts.find(([v]) => String(v) === b.dataset.v); set(o[0]); pills(el, opts, o[0], set); };
  }
  repPills(); alertPills();
  tfAll.addEventListener('click', () => setAllDay(!tfAllDay));
  $('tfCancel').addEventListener('click', () => { endEdit(); todoPages.scrollTo({ left: 0, behavior: 'smooth' }); });
  const tfCheck = () => { tfAdd.disabled = tfSaving || !tfTitle.value.trim() || !tfDay.value; };
  tfTitle.addEventListener('input', tfCheck); tfDay.addEventListener('change', tfCheck);
  tfAdd.addEventListener('click', () => {
    if (tfAdd.disabled) return;
    tfSaving = true; tfCheck(); tfAdd.textContent = '…';
    tfHint.classList.remove('err'); tfHint.textContent = '到点后台告诉陈璟';
    const body = { title: tfTitle.value.trim(), day: tfDay.value, time: tfAllDay ? '' : (tfTime.value || '09:30'), all_day: tfAllDay,
                   repeat: tfRep, alert_min: tfAlert, note: tfNote.value.trim() };
    if (editing) {
      body.id = editing.rid;
      if (editing.repeat && editing.repeat !== 'none' && tfDay.value === editing.day) delete body.day;
      post({ type: 'todoEdit', body });
    } else {
      body.author = 'user';
      post({ type: 'todoAdd', body });
    }
  });
  window.__todoAdded = err => {
    tfSaving = false; tfAdd.textContent = editing ? '保存' : '添加';
    if (err) { tfHint.classList.add('err'); tfHint.textContent = err; tfCheck(); return; }
    if (editing) endEdit();
    tfTitle.value = ''; tfNote.value = ''; tfCheck();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    todoPages.scrollTo({ left: 0, behavior: 'smooth' });
  };
  placeNote(H / 2);
  setDay(curKey);

  /* ---------- 每一步 ---------- */
  function step(dt) {
    T += dt;
    {
      const now = performance.now(), h = finger.hist;
      while (h.length > 2 && now - h[0][0] > 90) h.shift();
      if (finger.on && h.length >= 2 && now - h[h.length - 1][0] < 70) {
        const a = h[0], b = h[h.length - 1], span = Math.max(8, b[0] - a[0]) / 1000;
        finger.vx = (b[1] - a[1]) / span; finger.vy = (b[2] - a[2]) / span;
      } else { finger.vx = 0; finger.vy = 0; }
    }
    const speed = Math.hypot(finger.vx, finger.vy);
    const holding = finger.on && speed < FAST;

    lidDry += ((stream.length ? 1 : .35) - lidDry) * Math.min(1, dt * 2.5);
    updateLabels();
    // 眼眶：微微颤动，隔一会儿换一个字
    for (const c of lid) {
      if (T >= c.swap) {
        if (!c.swapped && T >= c.swap + .3) { c.g = glyphOf.get(lidChar(lidK++) + '400'); c.swapped = true; }
        if (T >= c.swap + .6) { c.swap = T + R(2.5, 6); c.swapped = false; }
      }
    }

    // 换日期：整条加速流下去，全部落进字海，再换成新一天的字
    if (draining && (T - drainT > 2.2 || !tear.some(c => c.g && c.vis > .2))) {
      for (const c of tear) if (c.g && c.vis > .3) { look(c, 0); toFall(c, R(-8, 8), 60, R(-.6, .6)); }
      tear.length = 0; draining = false; lastRow = null;
      setDay(pendingKey);
    }
    // 新的一行从眼角渗出来（这一天没有日记就不流）
    if (!draining && stream.length) {
      if (!lastRow) spawnRow(0);
      lastRow.s += speedAt(0) * dt;
      while (lastRow.s >= lastRow.gap) spawnRow(lastRow.s - lastRow.gap);
    }
    if (!stream.length) lastRow = null;

    for (let n = tear.length - 1; n >= 0; n--) {
      const c = tear[n];
      let ds = speedAt(c.s / path.total) * dt * (draining ? 4.5 : 1), blocked = false;
      if (holding && !draining && c.vis > .05 && c.s >= S_FREE) {
        const ni = at(c.s + ds), off = c.off + c.e;
        const cx = path.X[ni] - path.TY[ni] * off, cy = path.Y[ni] + path.TX[ni] * off;
        const dx = cx - finger.x, dy = cy - finger.y;
        if (Math.hypot(dx, dy) < RB) {
          blocked = true; ds = 0;
          let side = dx * -path.TY[ni] + dy * path.TX[ni];
          side = Math.abs(side) < 1 ? (c.off >= 0 ? 1 : -1) : Math.sign(side);
          c.e += side * 55 * dt;
        }
      }
      if (!blocked) c.e *= Math.exp(-dt * 1.4);
      c.e = clamp(c.e, -RB - 12, RB + 12);
      c.s += ds;
      if (c.s >= path.total) {
        look(c, 0);
        if (c.g && c.vis > .5 && (draining || c.row % 4 === 0)) {
          const v = speedAt(1), i = path.n - 1;
          c.size *= 1.15; c.alpha = Math.max(c.alpha, .9);
          toFall(c, path.TX[i] * v + R(-3, 3), path.TY[i] * v, R(-.5, .5));
        } else if (c.g && c.alpha > .02) {
          merging.push({ g: c.g, x0: c.x, y0: c.y, size0: c.size, rot: c.rot, a0: c.alpha, t0: T });
        }
        tear.splice(n, 1);
        continue;
      }
      look(c, dt);
    }

    for (let n = merging.length - 1; n >= 0; n--) if (T - merging[n].t0 > .5) merging.splice(n, 1);
    for (let n = free.length - 1; n >= 0; n--) {
      const f = free[n];
      if (f.sink >= 0) { if (T - f.sink > .45) free.splice(n, 1); continue; }
      f.vy = Math.min(f.vy + FALL_G * dt, FALL_MAX);
      f.vx *= Math.exp(-dt * 1.1);
      if (holding) {
        const dx = f.x - finger.x, dy = f.y - finger.y, d = Math.hypot(dx, dy);
        if (d < RB && d > .01) {
          const nx = dx / d, ny = dy / d;
          f.x = finger.x + nx * RB; f.y = finger.y + ny * RB;
          const vn = f.vx * nx + f.vy * ny;
          if (vn < 0) { f.vx -= vn * nx; f.vy -= vn * ny; }
          f.vx = f.vx * .94 + nx * 5; f.vy *= .94;
        }
      }
      f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.spin * dt;
      f.size = f.size0 * (1 - .22 * clamp((f.y - f.y0) / 220, 0, 1));
      if (f.vy > 0 && f.y >= f.land) {
        const z = clamp((f.land - SEA_TOP) / SEA_SPAN, 0, 1);
        f.sink = T; f.y = f.land; addRipple(f.x, f.land, clamp(f.size / 16, .55, 1) * (.75 + .5 * z));
      } else if (f.x < -60 || f.x > W + 60 || f.y > H + 40) free.splice(n, 1);
    }

    // 手在字海上划：沿轨迹一路荡开波纹
    if (finger.on && finger.y > SEA_TOP && Math.hypot(finger.x - finger.sx, finger.y - finger.sy) > 26) {
      addRipple(finger.x, finger.y, .62 + Math.min(.3, speed / 3500));
      finger.sx = finger.x; finger.sy = finger.y;
    }
    while (ripples.length && T - ripples[0].t > RIP_LIFE) ripples.shift();
  }

  /* ---------- 画 ---------- */
  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.setTransform(S, 0, 0, S, 0, 0);
    if (photoSrc.naturalWidth) ctx.drawImage(photoSrc, 0, G.PY, W, G.ph);

    for (const c of lid) {
      let a = c.a * lidDry;
      if (T >= c.swap && T < c.swap + .6) a *= Math.abs(T - c.swap - .3) / .3;          // 换字时淡出再淡入
      const wob = Math.sin(T * 2.1 + c.ph), wob2 = Math.cos(T * 1.6 + c.ph * 1.3);
      glyph(c.g, c.x + wob * .5, c.y + wob2 * .6, c.size * (1 + .03 * wob2), c.rot + wob * .05, a);
    }
    for (const c of tear) glyph(c.g, c.x, c.y, c.size, c.rot, c.alpha);
    for (const m of merging) {
      const k = Math.min(1, (T - m.t0) / .5), e = k * (2 - k);
      glyph(m.g, m.x0 + (TIP.x - m.x0) * e, m.y0 + (TIP.y + 4 - m.y0) * e, m.size0 * (1 - .6 * e), m.rot, m.a0 * (1 - k));
    }
    for (const f of free) {
      if (f.sink < 0) glyph(f.g, f.x, f.y, f.size, f.rot, f.alpha);
      else { const k = (T - f.sink) / .45; glyph(f.g, f.x, f.y + 3 * k, f.size * (1 - .35 * k), f.rot, f.alpha * (1 - k)); }
    }
    drawSea();
  }

  for (let i = 0; i < 26 * 30; i++) step(1 / 30);
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    step(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
