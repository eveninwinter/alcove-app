<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f2">
<title>Keepsake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
/* ── 想换颜色，改这里就够了 ── */
:root{
  --page:#EFEFED;           /* 泡泡页底色 */
  --ink:#3E4048;            /* 正文 */
  --meta:#9A9EA8;           /* 小字 */
  --sheet:rgba(247,247,247,.9);
  --you-bub:#19191a;        /* 人的气泡 */
  --you-ink:#ffffff;
  --ta-bub:#ffffff;         /* AI 的气泡 */
  --ta-ink:rgba(0,0,0,.84);
  --bub-op:.9;              /* 气泡不透明度 */
  --serif:"Noto Serif SC","Songti SC",serif;
  --mono:"Cormorant Garamond","Noto Serif SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:var(--page);overflow:hidden}
body{font-family:var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 22px) 24px 0;display:flex;justify-content:space-between;align-items:baseline;z-index:5;pointer-events:none}
.top h1{font-weight:400;font-size:20px;letter-spacing:6px}
.top span{font-size:10px;letter-spacing:1.5px;color:var(--meta)}
.tags{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 58px);z-index:5;display:flex;gap:16px;padding:0 24px;overflow-x:auto;scrollbar-width:none;font-size:10.5px;letter-spacing:2px;color:var(--meta)}
.tags::-webkit-scrollbar{display:none}
.tags span{white-space:nowrap;cursor:pointer;padding:3px 0;border-bottom:1px solid transparent}
.tags span.on{color:var(--ink);border-bottom-color:var(--ink)}
.labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lab{position:absolute;transform:translate(-50%,0);text-align:center;white-space:nowrap;transition:opacity .5s}
.lab b{display:block;font-weight:400;font-size:12px;letter-spacing:3px}
.lab small{display:block;margin-top:3px;font-size:8.5px;letter-spacing:1.2px;color:var(--meta)}
.hint{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 22px);font-size:10px;letter-spacing:2.5px;color:#a8a8aa;z-index:4;pointer-events:none}
.knob{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:6;display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:2px;color:var(--meta)}
.knob input{-webkit-appearance:none;appearance:none;width:76px;height:16px;background:transparent}
.knob input::-webkit-slider-runnable-track{height:1px;background:#c8c8ca}
.knob input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#f7f7f7;border:1px solid #9a9a9c;margin-top:-6px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:4px;color:#a8a8aa;z-index:9;background:var(--page);transition:opacity .8s}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:60;font-size:11.5px;letter-spacing:.08em;color:#666;background:rgba(255,255,255,.85);padding:6px 14px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.top,.tags,.hint,.knob{transition:opacity .4s}
body.opened .top,body.opened .tags,body.opened .hint,body.opened .knob{opacity:0;pointer-events:none}

/* ── 点开：泡放大停在上面，下面升起一张纸 ── */
.open{position:fixed;inset:0;z-index:20;overflow-y:auto;scrollbar-width:none;pointer-events:none}
.open::-webkit-scrollbar{display:none}
.open.on{pointer-events:auto}
.open .back{position:fixed;left:16px;top:calc(env(safe-area-inset-top) + 18px);font-size:12px;letter-spacing:2px;color:var(--meta);cursor:pointer;z-index:22;padding:6px 10px;opacity:0;transition:opacity .4s}
.open.on .back{opacity:1}
.gapTop{height:44vh}
.sheet{min-height:62vh;background:var(--sheet);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:28px 28px 0 0;
  padding:22px 18px calc(env(safe-area-inset-bottom) + 60px);box-shadow:0 -6px 30px rgba(0,0,0,.05);
  transform:translateY(60vh);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.open.on .sheet{transform:none}
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 14px}
.hd h2{font-weight:400;font-size:18px;letter-spacing:3px}
.hd .r{font-size:9.5px;letter-spacing:1.5px;color:var(--meta);display:flex;gap:12px;align-items:baseline}
.hd .more{color:var(--ink);cursor:pointer;font-size:14px;letter-spacing:1px;padding:0 2px}
.tagline{font-size:9.5px;letter-spacing:2px;color:var(--meta);padding:0 4px 12px}

/* 对话卡：一张圆角卡，底下一张壁纸，上面是聊天气泡 */
.card{border-radius:24px;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:132px;background:var(--wall);position:relative}
.card[data-wall=paper]{--wall:linear-gradient(135deg,#ede3d6,#faf2e8)}
.card[data-wall=blue]{--wall:linear-gradient(135deg,#c9e0eb,#abc7d4)}
.card[data-wall=night]{--wall:linear-gradient(135deg,#454f63,#12141c)}
.card[data-wall=mist]{--wall:linear-gradient(160deg,#e9e6ef,#d9dde6)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.06),rgba(0,0,0,.05));pointer-events:none}
.row{display:flex;position:relative;z-index:1}
.row.you{justify-content:flex-end;padding-left:35px}
.row.ta{padding-right:35px}
.bub{font-family:-apple-system,"PingFang SC",sans-serif;font-size:13.5px;line-height:1.6;padding:9px 12px;border-radius:16px;box-shadow:0 3px 8px rgba(0,0,0,.08);-webkit-user-select:text;user-select:text;white-space:pre-wrap}
.row.you .bub{background:color-mix(in srgb,var(--you-bub) calc(var(--bub-op)*100%),transparent);color:var(--you-ink)}
.row.ta .bub{background:color-mix(in srgb,var(--ta-bub) calc(var(--bub-op)*100%),transparent);color:var(--ta-ink)}
.card.glass .bub{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:.7px solid rgba(255,255,255,.3)}
.card.glass .row.you .bub{background:color-mix(in srgb,var(--you-bub) calc(var(--bub-op)*48%),transparent)}
.card.glass .row.ta .bub{background:color-mix(in srgb,var(--ta-bub) calc(var(--bub-op)*48%),transparent)}
.row.ctx{opacity:.45}
.row.ctx .bub{font-size:12px;box-shadow:none}

.drawer{display:none;margin:14px 4px 0;padding:12px 0 4px;border-top:.5px solid #d8d8da;font-size:10.5px;letter-spacing:1.5px;color:var(--meta)}
.drawer.on{display:block}
.drawer .opt{display:flex;gap:14px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.drawer .opt span{cursor:pointer;padding:3px 0;border-bottom:1px solid transparent}
.drawer .opt span.on{color:var(--ink);border-bottom-color:var(--ink)}

.sec{font-size:9.5px;letter-spacing:3px;color:#a6a6a8;margin:28px 4px 12px;display:flex;align-items:center;gap:10px}
.sec.first{margin-top:6px}
.sec::after{content:"";flex:1;height:1px;background:#dcdcde}
.pre{margin:0 4px 14px;padding-left:13px;border-left:1.5px solid #c4c4c6}
.pre.ta{border-left-color:#8e8e92}
.pre .w{font-size:9.5px;letter-spacing:2.5px;color:var(--meta);margin-bottom:5px}
.pre p{font-size:14px;line-height:1.9;white-space:pre-wrap;cursor:text}
.pre p.empty{color:#bcbcbe;font-size:13px}
.pre textarea,.box textarea{width:100%;border:none;border-bottom:1px solid #d0d0d2;background:transparent;font:inherit;font-size:14px;line-height:1.8;color:var(--ink);resize:none;outline:none;padding:4px 0;-webkit-user-select:text;user-select:text}
.askme{display:inline-block;margin-left:8px;font-size:11px;color:#555;border-bottom:1px solid #999;cursor:pointer}
.cm{margin:0 4px 18px;padding-left:11px;border-left:1px solid #d6d6d8}
.cm .w{font-size:9.5px;letter-spacing:1.5px;color:var(--meta);display:flex;gap:10px;align-items:center}
.cm .w b{font-weight:400;padding:1px 6px;background:#e4e4e6;color:#4a4a4c}
.cm .w b.ta{background:#3a3a3c;color:#f2f2f2}
.cm p{font-size:14px;line-height:1.85;margin:5px 0 4px;-webkit-user-select:text;user-select:text}
.cm .re{font-size:9.5px;letter-spacing:2px;color:#a6a6a8;cursor:pointer}
.cm .kids{margin:12px 0 0 4px}
.cm .kids .cm{margin:0 0 14px}
.empty-cm{color:#bcbcbe;font-size:13px;margin:0 4px 16px}
.box{margin:10px 4px 0;display:flex;gap:10px;align-items:flex-end}
.box .x{font-size:10px;color:#a6a6a8;cursor:pointer;padding-bottom:9px}
.wbtn{flex:none;font-size:11px;letter-spacing:3px;color:#f6f6f6;background:#38383a;padding:8px 16px;border-radius:16px;cursor:pointer}
.note{font-size:9.5px;letter-spacing:1px;color:#b4b4b6;margin:10px 4px 0;line-height:1.7}
@font-face{font-family:"Pinyon Script";src:url(../pinyon.ttf)}
@font-face{font-family:"Noto Serif SC";src:url(../serif-sc.woff2)}
@font-face{font-family:"Cormorant Garamond";src:url(cormorant.ttf)}
.top{padding-top:calc(env(safe-area-inset-top) + 34px) !important}
.top .ttl{display:flex;flex-direction:column;gap:2px}
.top h1{font-family:"Pinyon Script",cursive !important;font-size:28px !important;letter-spacing:0 !important;color:#6F7480;font-weight:400}
.top .eb{font-family:"Cormorant Garamond",serif;font-size:8.5px;letter-spacing:2.9px;color:#9A9EA8}
.seg{position:fixed;left:24px;top:calc(env(safe-area-inset-top) + 98px);z-index:5;display:flex;border:1px solid rgba(150,154,164,.45);border-radius:999px;padding:2px;font-size:11px;letter-spacing:2px}
.seg span{padding:4px 14px;border-radius:999px;color:#9A9EA8}
.seg span.on{background:rgba(255,255,255,.9);color:#2A2A2E;box-shadow:0 0 0 .5px rgba(150,154,164,.35)}
.tags{top:calc(env(safe-area-inset-top) + 140px) !important}
.exit{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 2px);z-index:7;font-size:22px;color:#9A9EA8;padding:6px 10px}
.statusbar{position:fixed;left:0;right:0;top:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font:600 15px -apple-system,sans-serif;color:#111;z-index:9}
html.dark{--page:#1B1C20;--ink:#E3E4E8;--meta:#8B8F99}
html.dark body{background:#1B1C20}
html.dark .top h1{color:#C3C6CE}
html.dark .top .eb{color:#8B8F99}
html.dark .seg{border-color:rgba(255,255,255,.14)}
html.dark .seg span{color:#8B8F99}
html.dark .seg span.on{background:rgba(255,255,255,.12);color:#E3E4E8;box-shadow:none}
html.dark .tags span.on{color:#E3E4E8;border-bottom-color:#E3E4E8}
html.dark .exit{color:#8B8F99}
</style>
</head>
<body>
<div id="load">吹泡泡……</div>
<canvas id="c"></canvas>
<div class="top"><div class="ttl"><h1>kept in glass</h1><span class="eb">KEEPSAKE · <span style="font-family:'Noto Serif SC';letter-spacing:2px">收藏</span></span></div><span class="mono" id="count"></span></div><div class="seg" id="seg"><span class="on">泡泡</span><span id="toSingle">单句</span></div><div class="exit" id="exit">‹</div>
<div class="tags mono" id="tags"></div>
<div class="labels" id="labels"></div>
<div class="toast mono" id="toast"></div>
<label class="knob mono">圆<input type="range" id="soft" min="0" max="2" step="0.05" value="1">软</label>
<div class="hint mono">按住凑近 · 轻点打开 · 下拉换一批</div>
<div class="open" id="open">
  <div class="back mono" id="back">‹ 收藏</div>
  <div class="gapTop" id="gapTop"></div>
  <div class="sheet" id="sheet"></div>
</div>
